<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 독서기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EEDD;
    --surface:#FFFDF6;
    --surface-alt:#FBF6E9;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --line:rgba(43,38,32,0.16);
    --accent:#3B5D45;
    --accent-soft:#DCE6DC;
    --gold:#C68A3D;
    --gold-soft:#F5E9D6;
    --danger:#A8442E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:1020px; margin:0 auto; padding:40px 20px 80px; }

  .masthead{
    position:relative;
    background:var(--surface);
    border:1px solid var(--ink);
    border-radius:10px;
    padding:28px 26px;
    overflow:hidden;
  }
  .masthead::after{
    content:"";
    position:absolute; top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 34px 34px 0;
    border-color:transparent var(--gold) transparent transparent;
  }
  .masthead .today{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; }
  .masthead h1{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(26px,5vw,34px); line-height:1.25;
    margin:0 0 10px; max-width:90%;
  }
  .masthead .sub{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; margin:0; max-width:52ch; }

  /* 학년 · 반 · 이름 고르기 */
  .who-bar{
    margin-top:18px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px;
  }
  .who-bar .who-title{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; }
  .picker{ display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:10px; }
  .picker.no-name{ grid-template-columns:1fr 1fr; max-width:420px; }
  .pk-field label{ margin-bottom:4px; }
  select:disabled{ background:#F4F1E6; color:#9A9184; }
  body[data-tab="board"] .who-bar, body[data-tab="teacher"] .who-bar{ display:none; }

  .tabs{ display:flex; gap:4px; margin:20px 0 0; padding-left:4px; flex-wrap:wrap; }
  .tab{
    position:relative; top:1px;
    padding:10px 18px;
    border:1px solid var(--ink); border-bottom:none;
    border-radius:8px 8px 0 0;
    background:var(--bg); color:var(--ink-soft);
    font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--surface); color:var(--ink); font-weight:600; border-bottom:1px solid var(--surface); }
  .panel-wrap{ border:1px solid var(--ink); border-radius:0 8px 8px 8px; background:var(--surface); padding:28px 26px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* 처음 설정 / 입장 코드 / 오류 안내 */
  .gate-card{
    display:none;
    margin-top:26px;
    background:var(--surface); border:1px solid var(--ink); border-radius:10px;
    padding:28px 26px; max-width:520px;
  }
  body.gated .gate-card{ display:block; }
  body.gated .tabs, body.gated .panel-wrap, body.gated .who-bar{ display:none; }
  .gate-card h2{ font-family:'Fraunces', serif; font-size:20px; margin:0 0 10px; }
  .gate-card p{ font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin:0 0 14px; }
  .gate-card code{ background:#EFEBDD; padding:2px 6px; border-radius:4px; font-size:13px; }

  label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  label .opt{ font-weight:400; opacity:0.8; }
  select, input[type=text], input[type=date], textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    background:#fff; font-family:'Work Sans', sans-serif; font-size:15px; color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ min-height:100px; resize:vertical; line-height:1.6; }
  .field{ margin-bottom:18px; }
  .field-row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row2 .field{ margin-bottom:18px; }

  button{ font-family:'Work Sans', sans-serif; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; border:none; padding:12px 22px; border-radius:6px; font-weight:600; font-size:15px; }
  .btn-primary:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); padding:8px 14px; border-radius:6px; font-size:13.5px; }
  .btn-icon{ background:#fff; border:1px solid var(--line); color:var(--ink); width:38px; height:38px; border-radius:6px; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .empty-note{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; }
  .note-box{
    border:1px dashed var(--accent); background:var(--accent-soft); color:var(--accent);
    border-radius:8px; padding:10px 14px; font-size:13.5px; margin:0 0 18px;
  }
  .note-box.warn{ border-color:var(--danger); background:#F3E2DD; color:var(--danger); }
  .hint-line{ font-size:12.5px; color:var(--ink-soft); margin:0 0 8px; line-height:1.6; }
  .save-msg{ font-size:13.5px; color:var(--accent); margin-top:10px; display:none; }
  .save-msg.show{ display:block; }
  .loading, .error-text{ font-size:14px; color:var(--ink-soft); padding:12px 0; margin:0; }
  .error-text{ color:var(--danger); }

  /* 왼쪽 쓰기 / 오른쪽 지난 기록 */
  .split{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr); gap:32px; align-items:start; }
  .split-side{ border-left:1px dashed var(--line); padding-left:28px; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; }
  .side-title{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:0 0 4px; }
  .side-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }

  .past-card{ padding:14px 0; border-bottom:1px dashed var(--line); }
  .past-card:last-child{ border-bottom:none; }
  .past-card.is-current{ background:var(--accent-soft); margin:0 -10px; padding:14px 10px; border-radius:6px; }
  .past-date{ font-size:12px; color:var(--ink-soft); }
  .past-title{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; margin:2px 0 2px; }
  .past-meta{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; }
  .past-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:10px 0 2px; }
  .past-text{ font-size:14px; line-height:1.65; white-space:pre-wrap; }
  .past-card .btn-ghost{ margin-top:10px; }
  .badge{ font-size:12px; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .badge.done{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .badge.pending{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .badge.draft{ background:var(--gold-soft); color:var(--gold); font-weight:600; }

  /* 독서기록장 (서평 5문단) */
  .essay-body{ margin-top:8px; }
  .essay-body p{ margin:0 0 10px; font-size:14.5px; line-height:1.9; text-indent:1em; }
  .essay-body p:last-child{ margin-bottom:0; }
  .essay-headline{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; line-height:1.4; margin:4px 0 2px; }

  .title-card, .para-card{
    border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:16px 18px 18px; margin-bottom:16px;
  }
  .title-card{ background:var(--surface-alt); }
  .card-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .card-head h3{ font-family:'Fraunces', serif; font-size:16.5px; font-weight:600; margin:0; flex:1; }
  .para-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:13px; font-weight:600; flex-shrink:0;
  }
  .para-count{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .para-card.filled .para-num::after{ content:""; }
  .para-card.filled{ border-color:var(--accent); }
  .para-guide{ font-size:13.5px; line-height:1.65; color:var(--ink-soft); margin:0 0 10px; }

  details.tip{ margin:0 0 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface-alt); }
  details.tip summary{ cursor:pointer; font-size:13px; font-weight:600; color:var(--accent); padding:8px 12px; list-style:none; }
  details.tip summary::-webkit-details-marker{ display:none; }
  details.tip summary::before{ content:'▸  '; }
  details.tip[open] summary::before{ content:'▾  '; }
  details.tip .tip-body{ padding:2px 14px 12px; font-size:13.5px; line-height:1.75; }
  .tip-body .frame{ background:#fff; border:1px dashed var(--line); border-radius:6px; padding:8px 12px; margin:6px 0; }
  .tip-body .ex-label{ display:inline-block; font-size:11.5px; font-weight:600; color:var(--gold); background:var(--gold-soft); border-radius:10px; padding:1px 8px; margin-right:6px; }
  .tip-body ul{ margin:6px 0 0; padding-left:18px; }
  .tip-body li{ margin-bottom:4px; }
  .tip-body dl{ margin:6px 0 0; }
  .tip-body dt{ font-weight:600; margin-top:8px; }
  .tip-body dd{ margin:2px 0 0 0; color:var(--ink-soft); }
  .tip-body .ex-text{ margin-top:2px; color:var(--ink); }
  .tip-body .cat{ font-weight:600; margin:8px 0 4px; font-size:13px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .word-chip{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:20px; padding:3px 10px; font-size:12.5px;
  }
  .word-chip:hover{ border-color:var(--accent); color:var(--accent); }

  textarea.lined{
    min-height:150px; padding:6px 14px; line-height:30px; font-size:15px;
    background-color:#fff;
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 29px, rgba(43,38,32,0.14) 29px, rgba(43,38,32,0.14) 30px);
    background-position:0 6px; background-attachment:local;
  }

  .save-bar{
    position:sticky; bottom:0; z-index:5;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border-top:1px solid var(--ink);
    margin:8px -26px -28px; padding:12px 26px;
  }
  .save-bar .progress{ font-size:13px; color:var(--ink-soft); flex:1; min-width:140px; }
  .save-bar .progress b{ color:var(--accent); }
  .save-bar .save-msg{ width:100%; margin:0; }
  .save-bar .error-text{ width:100%; padding:0; }

  /* 현황판 */
  .board-top{ display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px; }
  .date-nav{ display:flex; align-items:center; gap:8px; width:300px; max-width:100%; }
  .date-nav input[type=date]{ flex:1; }
  .link-btn{ font-size:12.5px; color:var(--accent); background:none; border:none; font-weight:600; padding:0; margin:0 14px 18px 0; }
  .subtabs{ display:flex; gap:8px; margin:6px 0 20px; flex-wrap:wrap; }
  .subtab{
    padding:9px 16px; border:1px solid var(--line); border-radius:20px;
    background:#fff; color:var(--ink-soft); font-size:14px; font-weight:500;
  }
  .subtab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .summary-bar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .summary-bar .label{ font-size:14px; color:var(--ink-soft); }
  .summary-bar .count{ font-family:'Fraunces', serif; font-size:26px; color:var(--accent); font-weight:600; }

  .student-list{ border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .student-row{ background:var(--surface); padding:13px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
  .student-list .student-block:last-child .student-row{ border-bottom:none; }
  .student-row.clickable{ cursor:pointer; }
  .student-row .left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .student-row .name{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; white-space:nowrap; }
  .student-row .num{ font-size:12px; color:var(--ink-soft); min-width:22px; }
  .caret{ color:var(--ink-soft); font-size:14px; transition:transform 0.15s ease; }
  .student-block.open .caret{ transform:rotate(90deg); }
  .student-detail{ display:none; background:var(--surface-alt); padding:12px 18px 16px; border-bottom:1px solid var(--line); }
  .student-list .student-block:last-child .student-detail{ border-bottom:none; }
  .student-block.open .student-detail{ display:block; }

  .count-row{ gap:16px; }
  .count-row .bar-track{ flex:1; height:8px; background:#EFEBDD; border-radius:4px; overflow:hidden; min-width:40px; }
  .count-row .bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .count-num{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--accent); min-width:48px; text-align:right; }
  .streak-tag{ font-size:12.5px; color:var(--gold); white-space:nowrap; }
  .book-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-size:12.5px; color:var(--ink-soft); background:#EFEBDD; padding:3px 10px; border-radius:20px; }
  .books-row{ display:block; }
  .books-row .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .books-row .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* 교사용 설정 */
  .teacher-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .teacher-head p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.6; max-width:60ch; }
  .teacher-login{ max-width:420px; }
  .t-toolbar{ border:1px solid var(--ink); border-radius:10px; background:var(--surface-alt); padding:16px 18px 6px; margin-bottom:16px; }
  .t-toolbar .tb-title{ font-family:'Fraunces', serif; font-size:15.5px; font-weight:600; margin:0 0 10px; }
  .t-types{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .t-type{
    padding:9px 14px; border:1px solid var(--line); border-radius:20px; background:#fff;
    color:var(--ink-soft); font-size:13.5px; font-weight:500;
  }
  .t-type.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .t-tool-grid{ display:grid; grid-template-columns:1fr 180px; gap:12px; }
  .t-table{ border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .t-head, .t-row{ display:grid; grid-template-columns:34px 34px 1fr 1.5fr 0.8fr 0.8fr 78px; gap:8px; align-items:center; padding:10px 14px; }
  .t-head{ background:var(--surface-alt); font-size:12px; color:var(--ink-soft); font-weight:600; border-bottom:1px solid var(--line); }
  .t-row{ background:var(--surface); border-bottom:1px solid var(--line); font-size:14px; }
  .t-block:last-child .t-row{ border-bottom:none; }
  .t-row .t-name{ font-family:'Fraunces', serif; font-size:15.5px; font-weight:500; }
  .t-row .t-num{ font-size:12px; color:var(--ink-soft); }
  .t-row small{ color:var(--ink-soft); }
  .t-row b{ color:var(--accent); }
  .t-check{ width:18px; height:18px; accent-color:var(--accent); }
  .t-logs{ display:none; background:var(--surface-alt); padding:8px 18px 12px 60px; border-bottom:1px solid var(--line); }
  .t-block.open .t-logs{ display:block; }
  .t-log{ display:flex; gap:10px; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .t-log:last-child{ border-bottom:none; }
  .t-log.cancelled{ color:#9A9184; text-decoration:line-through; }
  .t-log .tl-type{ font-weight:600; margin-right:6px; }

  @media (max-width:860px){
    .page{ padding:24px 14px 60px; }
    .split{ grid-template-columns:1fr; gap:0; }
    .split-side{ border-left:none; padding-left:0; position:static; max-height:none; overflow:visible; border-top:1px solid var(--line); margin-top:30px; padding-top:22px; }
    .masthead{ padding:22px 18px; }
    .panel-wrap{ padding:20px 18px; }
    .save-bar{ margin:8px -18px -20px; padding:12px 18px; }
    .tab{ padding:9px 12px; font-size:13px; }
    .picker{ grid-template-columns:1fr 1fr; }
    .picker .pk-name{ grid-column:1 / -1; }
    .t-tool-grid{ grid-template-columns:1fr; }
    .t-head{ display:none; }
    .t-row{ grid-template-columns:30px 1fr auto; row-gap:4px; }
    .t-row .t-num{ display:none; }
    .t-row .t-stat{ grid-column:2 / -1; font-size:13px; }
    .t-logs{ padding-left:18px; }
  }
</style>
</head>
<body data-tab="record">
<div class="page">

  <header class="masthead">
    <p class="today" id="todayLabel"></p>
    <h1>매일 독서기록</h1>
    <p class="sub">학년과 반, 이름을 고르고 오늘 읽은 책을 기록해요. 다 읽은 책은 독서기록장에 서평으로 남겨요.</p>
  </header>

  <div class="gate-card" id="gate"></div>

  <div class="who-bar" id="whoBar">
    <p class="who-title">나는 누구일까요? 학년 · 반 · 이름을 골라요.</p>
    <div id="whoSlot"></div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="record">매일 독서기록</button>
    <button class="tab" data-tab="essay">독서기록장</button>
    <button class="tab" data-tab="board">현황판</button>
    <button class="tab" data-tab="teacher">교사용 설정</button>
  </nav>

  <div class="panel-wrap">

    <!-- 매일 독서기록: 날짜, 책 이름, 읽은 챕터(쪽수), 줄거리, 느낀 점 -->
    <section class="tab-panel active" id="panel-record">
      <div class="split">
        <div class="split-main"><div id="recordFormArea"><p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p></div></div>
        <aside class="split-side" id="recordHistoryArea"></aside>
      </div>
    </section>

    <!-- 독서기록장: 책 이름, 다 읽은 날짜, 서평 5문단 / 옆에 완성된 글 -->
    <section class="tab-panel" id="panel-essay">
      <div class="split">
        <div class="split-main"><div id="essayFormArea"><p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p></div></div>
        <aside class="split-side" id="essayHistoryArea"></aside>
      </div>
    </section>

    <!-- 현황판: 학년·반별 독서록 권수 / 매일 독서기록 횟수 / 날짜별 현황 -->
    <section class="tab-panel" id="panel-board">
      <div class="board-top">
        <div id="boardPickerSlot"></div>
        <div>
          <label>날짜</label>
          <div class="date-nav">
            <button class="btn-icon" id="prevDayBtn" type="button">‹</button>
            <input type="date" id="boardDateInput">
            <button class="btn-icon" id="nextDayBtn" type="button">›</button>
          </div>
        </div>
      </div>
      <div>
        <button class="link-btn" id="jumpTodayBtn" type="button">오늘로 이동</button>
        <button class="link-btn" id="refreshBoardBtn" type="button">↻ 새로고침</button>
      </div>
      <div class="subtabs" id="boardSubtabs">
        <button class="subtab active" data-sub="books" type="button">독서록 권수</button>
        <button class="subtab" data-sub="count" type="button">매일 독서기록 횟수</button>
        <button class="subtab" data-sub="date" type="button">날짜별 현황</button>
      </div>
      <div id="boardArea"><p class="loading">불러오는 중...</p></div>
    </section>

    <!-- 교사용 설정: 손으로 쓴 독서록 체크, 면제권 사용, 특이사항 -->
    <section class="tab-panel" id="panel-teacher">
      <div id="teacherArea"></div>
    </section>

  </div>
</div>

<script>
(function(){
  // ★★★ 여기에 Apps Script 웹 앱 주소(/exec 로 끝나는 주소)를 붙여넣으세요. ★★★
  const API_URL = 'https://script.google.com/macros/s/AKfycbyAkqylJ1h_5Q8YJ8pnL0oEtSgIqWKN63Tb8d8FEy2eWOAr7dPPiqBz9wMfSgRp-rZc1Q/exec';

  // ---------- 작은 도구들 ----------
  const $ = id => document.getElementById(id);
  const TODAY = todayStr();

  function todayStr(d){
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDateKo(s){
    const p = s.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
  }
  function fmtShort(s){ const p = s.split('-').map(Number); return p[1] + '/' + p[2]; }
  function addDays(s, delta){
    const p = s.split('-').map(Number);
    const d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() + delta);
    return todayStr(d);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  $('todayLabel').textContent = '오늘은 ' + fmtDateKo(TODAY);

  // ---------- 서버(Apps Script)와 대화하기 ----------
  const SETUP_DONE = API_URL.indexOf('https://script.google.com/') === 0;
  const CODE_KEY = 'readinglog.classCode';
  let classCode = '';
  try{ classCode = localStorage.getItem(CODE_KEY) || ''; }catch(e){}

  async function unwrap(res){
    let json;
    try{ json = await res.json(); }catch(e){ throw new Error('서버 응답을 읽지 못했어요.'); }
    if(!json.ok){
      const err = new Error(json.error || '요청에 실패했어요.');
      err.fromServer = true;
      err.code = json.error;
      throw err;
    }
    return json.data;
  }
  async function apiGet(action, params){
    const qs = new URLSearchParams(Object.assign({ action: action, code: classCode }, params || {}));
    return unwrap(await fetch(API_URL + '?' + qs.toString()));
  }
  async function apiPost(action, payload){
    // 글자 그대로(text/plain) 보내야 브라우저가 사전 확인 없이 바로 전달해요.
    return unwrap(await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action, code: classCode }, payload))
    }));
  }

  // 화면에 보여줄 오류 문구 (서버가 준 한글 문구는 그대로, 그 외는 기본 문구)
  function showError(err, el, fallback){
    if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return; }
    el.textContent = (err && err.fromServer && err.message) ? err.message : fallback;
    el.style.display = 'block';
  }

  // ---------- 처음 설정 / 입장 코드 / 연결 오류 화면 ----------
  function showGate(kind, extra){
    const g = $('gate');
    document.body.classList.add('gated');
    if(kind === 'setup'){
      g.innerHTML = `
        <h2>처음 한 번만 설정이 필요해요</h2>
        <p>선생님께서 <code>index.html</code> 맨 위쪽의 <code>API_URL</code> 줄에 Apps Script 웹 앱 주소를 붙여넣어 주세요.</p>
        <p>주소는 <code>https://script.google.com/</code> 으로 시작해서 <code>/exec</code> 으로 끝나요.</p>
      `;
    } else if(kind === 'code'){
      g.innerHTML = `
        <h2>입장 코드를 입력해주세요</h2>
        <p>${extra === 'wrong' ? '코드가 맞지 않아요. 선생님께 다시 확인해보세요.' : '선생님께서 알려주신 코드를 입력하면 들어갈 수 있어요.'}</p>
        <div class="field"><input type="text" id="gateCodeInput" placeholder="입장 코드" autocomplete="off"></div>
        <button class="btn-primary" id="gateCodeBtn" type="button">들어가기</button>
      `;
      const input = $('gateCodeInput');
      const submit = () => {
        classCode = input.value.trim();
        try{ localStorage.setItem(CODE_KEY, classCode); }catch(e){}
        init();
      };
      $('gateCodeBtn').addEventListener('click', submit);
      input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
      input.focus();
    } else {
      g.innerHTML = `
        <h2>서버에 연결하지 못했어요</h2>
        <p>인터넷 연결을 확인하고 잠시 뒤에 다시 시도해주세요.</p>
        <button class="btn-primary" id="gateRetryBtn" type="button">다시 시도</button>
      `;
      $('gateRetryBtn').addEventListener('click', init);
    }
  }
  function hideGate(){ document.body.classList.remove('gated'); }

  // ---------- 공통 상태 ----------
  let roster = [];       // [{grade, cls, num, name}] (시트에 적은 순서 그대로)
  let books = [];
  let currentBook = '';
  let me = null;         // 고른 학생 (roster의 한 줄)
  let entries = [];      // 내 매일 독서기록 (최신 날짜 먼저)
  let essays = [];       // 내 독서기록장 (최근 저장 먼저)

  function studentParams(st){ st = st || me; return { grade: st.grade, cls: st.cls, name: st.name }; }

  // =====================================================
  // 학년 > 반 > 이름 고르기
  // =====================================================
  const NONE = '__none__';
  const toVal = x => x === '' ? NONE : x;
  const fromVal = v => v === NONE ? '' : v;
  function uniq(list){ const out = []; list.forEach(x => { if(out.indexOf(x) < 0) out.push(x); }); return out; }
  function hasClassInfo(){ return roster.some(s => s.grade || s.cls); }
  function gradesOf(){ return uniq(roster.map(s => s.grade)); }
  function classesOf(g){ return uniq(roster.filter(s => s.grade === g).map(s => s.cls)); }
  function gradeLabel(g){ return g ? g + '학년' : '학년 미지정'; }
  function classLabel(c){ return c ? c + '반' : '반 미지정'; }
  function studentLabel(s){ return (s.num ? s.num + '번 ' : '') + s.name; }
  function classTitle(g, c){ return (g || c) ? gradeLabel(g) + ' ' + classLabel(c) : '전체'; }

  const LAST_CLASS_KEY = 'readinglog.lastClass';
  function rememberClass(p){
    if(!p.gv || !p.cv) return;
    try{ localStorage.setItem(LAST_CLASS_KEY, JSON.stringify({ gv: p.gv, cv: p.cv })); }catch(e){}
  }
  function validClass(gv, cv){
    return roster.some(s => toVal(s.grade) === gv && toVal(s.cls) === cv);
  }
  function lastClass(){
    try{
      const o = JSON.parse(localStorage.getItem(LAST_CLASS_KEY) || 'null');
      if(o && validClass(o.gv, o.cv)) return o;
    }catch(e){}
    return null;
  }
  // 아직 반을 안 골랐으면: 내가 고른 반 > 지난번에 고른 반 > 명단 첫 반 순서로 정한다
  function defaultClassFor(p, allowFirst){
    if(!hasClassInfo() || (p.gv && p.cv)) return;
    if(me){ p.gv = toVal(me.grade); p.cv = toVal(me.cls); return; }
    const l = lastClass();
    if(l){ p.gv = l.gv; p.cv = l.cv; return; }
    if(allowFirst && roster.length){ p.gv = toVal(roster[0].grade); p.cv = toVal(roster[0].cls); }
  }
  // 선택칸을 새로 그린다 (이벤트가 두 번 붙지 않게 항상 새로 그린 뒤 붙인다)
  function remountPicker(p, slotId){
    $(slotId).innerHTML = p.html();
    p.mount();
  }

  function makePicker(id, withName, onChange){
    const p = { id: id, withName: withName, gv: '', cv: '', idx: -1, onChange: onChange };
    p.html = () => `
      <div class="picker${withName ? '' : ' no-name'}" id="${id}Box">
        <div class="pk-field pk-grade"><label for="${id}Grade">학년</label><select id="${id}Grade"></select></div>
        <div class="pk-field pk-class"><label for="${id}Class">반</label><select id="${id}Class"></select></div>
        ${withName ? `<div class="pk-field pk-name"><label for="${id}Name">이름</label><select id="${id}Name"></select></div>` : ''}
      </div>`;
    p.student = () => p.idx >= 0 ? roster[p.idx] : null;
    p.classInfo = () => (p.gv && p.cv) ? { grade: fromVal(p.gv), cls: fromVal(p.cv) } : null;
    p.mount = () => {
      const gSel = $(id + 'Grade'), cSel = $(id + 'Class'), nSel = withName ? $(id + 'Name') : null;
      const classMode = hasClassInfo();
      gSel.parentElement.style.display = classMode ? '' : 'none';
      cSel.parentElement.style.display = classMode ? '' : 'none';
      function fill(){
        if(classMode){
          const grades = gradesOf();
          if(!p.gv && grades.length === 1) p.gv = toVal(grades[0]);
          gSel.innerHTML = '<option value="">학년 선택</option>' + grades.map(g =>
            `<option value="${esc(toVal(g))}"${toVal(g) === p.gv ? ' selected' : ''}>${esc(gradeLabel(g))}</option>`).join('');
          const classes = p.gv ? classesOf(fromVal(p.gv)) : [];
          if(p.gv && !p.cv && classes.length === 1) p.cv = toVal(classes[0]);
          cSel.innerHTML = '<option value="">반 선택</option>' + classes.map(c =>
            `<option value="${esc(toVal(c))}"${toVal(c) === p.cv ? ' selected' : ''}>${esc(classLabel(c))}</option>`).join('');
          cSel.disabled = !p.gv;
        }
        if(nSel){
          const ready = !classMode || (p.gv && p.cv);
          const list = [];
          if(ready) roster.forEach((s, i) => {
            if(!classMode || (toVal(s.grade) === p.gv && toVal(s.cls) === p.cv)) list.push({ s: s, i: i });
          });
          nSel.innerHTML = '<option value="">이름 선택</option>' + list.map(x =>
            `<option value="${x.i}"${x.i === p.idx ? ' selected' : ''}>${esc(studentLabel(x.s))}</option>`).join('');
          nSel.disabled = !ready;
        }
      }
      gSel.addEventListener('change', () => { p.gv = gSel.value; p.cv = ''; p.idx = -1; p.touched = true; fill(); p.onChange(p); });
      cSel.addEventListener('change', () => { p.cv = cSel.value; p.idx = -1; p.touched = true; fill(); rememberClass(p); p.onChange(p); });
      if(nSel) nSel.addEventListener('change', () => { p.idx = nSel.value === '' ? -1 : Number(nSel.value); p.onChange(p); });
      fill();
    };
    return p;
  }

  // ---------- 책 선택칸 (Books 시트 목록 + 직접 입력) ----------
  function bookFieldHtml(id, labelHtml, value){
    if(books.length === 0){
      return `
        <div class="field">
          <label for="${id}">${labelHtml}</label>
          <input type="text" id="${id}" placeholder="예: 마당을 나온 암탉" value="${esc(value)}">
        </div>`;
    }
    const custom = !!value && books.indexOf(value) < 0;
    return `
      <div class="field">
        <label for="${id}Select">${labelHtml}</label>
        <select id="${id}Select">
          <option value="">책을 선택하세요</option>
          ${books.map(b => `<option value="${esc(b)}"${b === value ? ' selected' : ''}>${esc(b)}</option>`).join('')}
          <option value="__custom__"${custom ? ' selected' : ''}>✏️ 직접 입력</option>
        </select>
        <input type="text" id="${id}" placeholder="책 이름을 직접 입력하세요" value="${custom ? esc(value) : ''}" style="margin-top:8px;display:${custom ? 'block' : 'none'};">
      </div>`;
  }
  function bindBookField(id, onChange){
    const input = $(id);
    const select = $(id + 'Select');
    if(!select){
      input.addEventListener('input', () => onChange(input.value));
      return;
    }
    select.addEventListener('change', () => {
      if(select.value === '__custom__'){
        input.style.display = 'block';
        input.focus();
        onChange(input.value);
      } else {
        input.style.display = 'none';
        onChange(select.value);
      }
    });
    input.addEventListener('input', () => onChange(input.value));
  }

  // ---------- 고른 학생 불러오기 ----------
  const whoPicker = makePicker('who', true, p => selectStudent(p.student()));

  async function selectStudent(st){
    me = st;
    entries = [];
    essays = [];
    recordDate = TODAY;
    recordDraft = freshRecordDraft();
    essayDraft = freshEssayDraft();
    essayNote = '';
    if(!st){
      renderRecordForm(); renderRecordHistory(); renderEssayForm(); renderEssayHistory();
      return;
    }
    $('recordFormArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    $('essayFormArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      const d = await apiGet('getStudentData', studentParams(st));
      if(me !== st) return; // 그 사이 다른 학생으로 바뀐 경우
      entries = d.entries;
      essays = d.essays;
      recordDraft = freshRecordDraft();
      essayDraft = freshEssayDraft();
      renderRecordForm(); renderRecordHistory(); renderEssayForm(); renderEssayHistory();
    }catch(err){
      if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return; }
      const msg = '<p class="error-text">불러오지 못했어요. 다시 시도해주세요.</p>';
      $('recordFormArea').innerHTML = msg;
      $('essayFormArea').innerHTML = msg;
    }
  }

  // =====================================================
  // 매일 독서기록 (날짜, 책 이름, 읽은 챕터(쪽수), 줄거리, 느낀 점)
  // =====================================================
  let recordDate = TODAY;
  let recordDraft = freshRecordDraft();

  function lastBookOf(list){
    const found = list.find(e => e.bookTitle);
    return found ? found.bookTitle : '';
  }
  function freshRecordDraft(){
    return { book: lastBookOf(entries) || currentBook || '', chapter: '', summary: '', impression: '', loaded: false };
  }

  // 선택한 날짜에 이미 쓴 기록이 있으면 불러와서 보여준다 (저장하면 수정됨)
  function loadRecordForDate(){
    const e = entries.find(x => x.date === recordDate);
    if(e){
      recordDraft = { book: e.bookTitle || '', chapter: e.chapter || '', summary: e.summary || '', impression: e.impression || '', loaded: true };
    } else if(recordDraft.loaded){
      recordDraft = freshRecordDraft();
    }
    renderRecordForm();
    renderRecordHistory();
  }

  function renderRecordForm(){
    const area = $('recordFormArea');
    if(!me){
      area.innerHTML = '<p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p>';
      return;
    }
    const d = recordDraft;
    area.innerHTML = `
      <div class="field">
        <label for="recordDate">날짜</label>
        <input type="date" id="recordDate" value="${esc(recordDate)}" max="${TODAY}">
      </div>
      <p class="note-box" id="recordLoadedNote" style="display:${d.loaded ? 'block' : 'none'};">이 날짜에 쓴 기록을 불러왔어요. 저장하면 수정돼요.</p>
      ${bookFieldHtml('recordBook', '책 이름', d.book)}
      <div class="field">
        <label for="recordChapter">읽은 챕터(쪽수)</label>
        <input type="text" id="recordChapter" placeholder="예: 3장 또는 45~60쪽" value="${esc(d.chapter)}">
      </div>
      <div class="field">
        <label for="recordSummary">줄거리</label>
        <textarea id="recordSummary" placeholder="읽은 부분의 줄거리를 간단히 적어요.">${esc(d.summary)}</textarea>
      </div>
      <div class="field">
        <label for="recordImpression">느낀 점</label>
        <textarea id="recordImpression" placeholder="읽고 나서 느낀 점을 간단히 적어요.">${esc(d.impression)}</textarea>
      </div>
      <button class="btn-primary" id="recordSaveBtn" type="button" disabled>기록 저장하기</button>
      <p class="save-msg" id="recordSaveMsg">저장했어요. 👍</p>
      <p class="error-text" id="recordError" style="display:none;"></p>
    `;

    const dateEl = $('recordDate');
    const saveBtn = $('recordSaveBtn');
    const saveMsg = $('recordSaveMsg');
    const errEl = $('recordError');

    function checkValid(){
      saveBtn.disabled = !(d.book.trim() && d.chapter.trim() && d.summary.trim() && d.impression.trim());
    }
    function touched(){ saveMsg.classList.remove('show'); checkValid(); }

    dateEl.addEventListener('change', () => {
      if(!dateEl.value || dateEl.value > TODAY){ dateEl.value = recordDate; return; }
      recordDate = dateEl.value;
      loadRecordForDate();
    });
    bindBookField('recordBook', v => { d.book = v; touched(); });
    $('recordChapter').addEventListener('input', e => { d.chapter = e.target.value; touched(); });
    $('recordSummary').addEventListener('input', e => { d.summary = e.target.value; touched(); });
    $('recordImpression').addEventListener('input', e => { d.impression = e.target.value; touched(); });
    checkValid();

    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
      saveMsg.classList.remove('show');
      errEl.style.display = 'none';
      try{
        entries = await apiPost('submitRecord', Object.assign(studentParams(), {
          date: recordDate,
          bookTitle: d.book.trim(), chapter: d.chapter.trim(),
          summary: d.summary.trim(), impression: d.impression.trim()
        }));
        d.loaded = true;
        $('recordLoadedNote').style.display = 'block';
        saveMsg.classList.add('show');
        renderRecordHistory();
      }catch(err){
        showError(err, errEl, '저장에 실패했어요. 다시 시도해주세요.');
      }finally{
        saveBtn.textContent = '기록 저장하기';
        checkValid();
      }
    });
  }

  function renderRecordHistory(){
    const area = $('recordHistoryArea');
    if(!me){
      area.innerHTML = '<p class="side-title">내 지난 매일 독서기록</p><p class="side-sub">이름을 고르면 지난 기록이 여기에 보여요.</p>';
      return;
    }
    if(entries.length === 0){
      area.innerHTML = '<p class="side-title">내 지난 매일 독서기록</p><p class="side-sub">아직 쓴 기록이 없어요.</p>';
      return;
    }
    area.innerHTML = `
      <p class="side-title">내 지난 매일 독서기록 (${entries.length}번)</p>
      <p class="side-sub">날짜별로 쓴 기록이에요. 고치려면 "이 날짜 불러오기"를 눌러요.</p>
      ${entries.map((e, i) => `
        <div class="past-card${e.date === recordDate ? ' is-current' : ''}">
          <div class="past-date">${fmtDateKo(e.date)}</div>
          <div class="past-title">${esc(e.bookTitle || '(책 이름 없음)')}</div>
          <div class="past-meta">${esc(e.chapter)}</div>
          ${e.recordType === '공책'
            ? '<div class="past-text" style="color:var(--ink-soft);">공책에 기록했어요.</div>'
            : `<div class="past-label">줄거리</div><div class="past-text">${esc(e.summary)}</div>
               <div class="past-label">느낀 점</div><div class="past-text">${esc(e.impression)}</div>`}
          <button class="btn-ghost" type="button" data-load="${i}">이 날짜 불러오기</button>
        </div>
      `).join('')}
    `;
    area.querySelectorAll('[data-load]').forEach(btn => {
      btn.addEventListener('click', () => {
        recordDate = entries[Number(btn.getAttribute('data-load'))].date;
        loadRecordForDate();
        $('panel-record').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // =====================================================
  // 독서기록장 (책 이름, 다 읽은 날짜, 서평 5문단) - 서평 쓰기 학습지의 안내와 예시를 문단마다 넣었어요
  // =====================================================
  const FEELING_WORDS = [
    ['기쁘고 좋은 느낌', ['기뻤다','즐거웠다','뿌듯했다','흐뭇했다','따뜻했다','든든했다','고마웠다','감동적이었다']],
    ['슬프고 힘든 느낌', ['슬펐다','속상했다','안타까웠다','서운했다','걱정되었다','불안했다','마음이 아팠다','씁쓸했다']],
    ['놀랍고 궁금한 느낌', ['놀라웠다','신기했다','뜻밖이었다','궁금했다','의아했다','흥미로웠다','긴장되었다','당황스러웠다']],
    ['불편하고 답답한 느낌', ['화가 났다','답답했다','억울했다','아쉬웠다','무서웠다','두려웠다','부끄러웠다','미안했다']],
    ['인물에게 느낀 마음', ['공감되었다','대견했다','존경스러웠다','안심되었다','반가웠다','행복했다','재미있었다','신났다']]
  ];

  function freshEssayDraft(){
    return { book: '', finishDate: TODAY, title: '', paras: ['', '', '', '', ''] };
  }
  let essayDraft = freshEssayDraft();
  let essayNote = '';   // 책 고르기에서 알려줄 말 (이미 쓴 글을 불러왔을 때 등)

  function essayDraftEmpty(d){ return !d.title.trim() && d.paras.every(p => !p.trim()); }
  function findEssay(book){ book = (book || '').trim(); return book ? essays.find(e => e.bookTitle === book) : null; }

  function paraCardHtml(i, d){
    const p = ESSAY_PARAS[i];
    const feel = p.feelings ? `
      <details class="tip"><summary>💡 느낌을 나타내는 여러 가지 낱말 (눌러서 문단에 넣어요)</summary>
        <div class="tip-body">
          <p class="hint-line">인상적인 장면을 읽으며 내 마음이 어땠는지 생각해 보세요.</p>
          ${FEELING_WORDS.map(g => `<p class="cat">${g[0]}</p><div class="chip-row">${g[1].map(w => `<button type="button" class="word-chip" data-word="${esc(w)}" data-target="essayP${i}">${w}</button>`).join('')}</div>`).join('')}
        </div>
      </details>` : '';
    return `
      <section class="para-card" id="paraCard${i}">
        <div class="card-head">
          <span class="para-num">${i + 1}</span>
          <h3>${i + 1}문단 · ${p.title}</h3>
          <span class="para-count" id="paraCount${i}"></span>
        </div>
        <p class="para-guide">${p.guide}</p>
        ${p.tips.map(t => `<details class="tip"><summary>${t.label}</summary><div class="tip-body">${t.body}</div></details>`).join('')}
        ${feel}
        ${p.example ? `<details class="tip"><summary>📖 예시 보기</summary><div class="tip-body">${p.example}</div></details>` : ''}
        <textarea class="lined" id="essayP${i}" placeholder="${esc(p.placeholder)}">${esc(d.paras[i])}</textarea>
      </section>`;

  function renderEssayForm(){
    const area = $('essayFormArea');
    if(!me){
      area.innerHTML = '<p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p>';
      return;
    }
    const d = essayDraft;
    area.innerHTML = `
      <p class="note-box" id="essayNote" style="display:${essayNote ? 'block' : 'none'};">${esc(essayNote)}</p>
      ${bookFieldHtml('essayBook', '책 이름', d.book)}
      <div class="field">
        <label for="essayFinish">다 읽은 날짜</label>
        <input type="date" id="essayFinish" value="${esc(d.finishDate)}" max="${TODAY}">
      </div>
      <div class="title-card">
        <div class="card-head"><h3>서평 제목</h3></div>
        <p class="para-guide">${TITLE_TIP.text}</p>
        <details class="tip"><summary>📖 예시 보기</summary>
          <div class="tip-body"><ul>${TITLE_TIP.examples.map(x => `<li><span class="ex-label">예</span>${x}</li>`).join('')}</ul></div>
        </details>
        <input type="text" id="essayTitle" placeholder="내가 쓸 서평의 제목" value="${esc(d.title)}">
      </div>
      <p class="hint-line">각 문단은 줄을 바꾸지 않고 이어서 써요. 오른쪽(또는 아래)에는 내가 쓴 글이 문단 제목 없이 한 편의 글로 보여요.</p>
      ${ESSAY_PARAS.map((_, i) => paraCardHtml(i, d)).join('')}
      <div class="save-bar">
        <span class="progress" id="essayProgress"></span>
        <button class="btn-primary" id="essaySaveBtn" type="button" disabled>독서기록장 저장하기</button>
        <p class="note-box warn" id="essayDupNote" style="display:none;margin:0;width:100%;">이 책으로 쓴 독서기록장이 이미 있어요. 저장하면 지금 쓴 내용으로 바뀌어요.</p>
        <p class="save-msg" id="essaySaveMsg"></p>
        <p class="error-text" id="essayError" style="display:none;"></p>
      </div>
    `;

    const saveBtn = $('essaySaveBtn');
    const saveMsg = $('essaySaveMsg');
    const errEl = $('essayError');

    function refresh(){
      const done = d.paras.filter(p => p.trim()).length;
      d.paras.forEach((p, i) => {
        $('paraCard' + i).classList.toggle('filled', !!p.trim());
        $('paraCount' + i).textContent = p.trim() ? p.trim().length + '자' : '';
      });
      $('essayProgress').innerHTML = done === 5
        ? '<b>5문단을 모두 썼어요!</b> 저장하면 독서록 권수에 들어가요.'
        : `서평 문단 <b>${done}/5</b> · 5문단을 모두 쓰면 독서록 권수에 들어가요.`;
      saveBtn.disabled = !(d.book.trim() && (d.title.trim() || done > 0));
      const dup = findEssay(d.book);
      $('essayDupNote').style.display = (dup && !essayDraftEmpty(d)) ? 'block' : 'none';
    }
    function touched(){ saveMsg.classList.remove('show'); refresh(); }

    bindBookField('essayBook', v => {
      d.book = v;
      const dup = findEssay(v);
      if(dup && essayDraftEmpty(d)){
        // 비어 있는 상태에서 이미 쓴 책을 고르면, 쓰던 글을 불러온다
        essayDraft = { book: dup.bookTitle, finishDate: dup.date <= TODAY ? dup.date : TODAY, title: dup.reviewTitle || '', paras: dup.paragraphs.slice(0, 5) };
        essayNote = '이 책으로 쓰던 독서기록장을 불러왔어요. 이어서 쓰면 돼요.';
        renderEssayForm();
        return;
      }
      touched();
    });
    $('essayFinish').addEventListener('change', e => {
      if(!e.target.value || e.target.value > TODAY){ e.target.value = d.finishDate; return; }
      d.finishDate = e.target.value; touched();
    });
    $('essayTitle').addEventListener('input', e => { d.title = e.target.value; touched(); });
    ESSAY_PARAS.forEach((_, i) => {
      $('essayP' + i).addEventListener('input', e => { d.paras[i] = e.target.value; touched(); });
    });
    // 느낌 낱말을 눌러서 3문단에 넣기
    area.querySelectorAll('.word-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const ta = $(chip.getAttribute('data-target'));
        const w = chip.getAttribute('data-word');
        const start = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
        const end = ta.selectionEnd == null ? ta.value.length : ta.selectionEnd;
        ta.value = ta.value.slice(0, start) + w + ta.value.slice(end);
        const pos = start + w.length;
        try{ ta.setSelectionRange(pos, pos); ta.focus(); }catch(e){}
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      });
    });
    refresh();

    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
      saveMsg.classList.remove('show');
      errEl.style.display = 'none';
      try{
        essays = await apiPost('submitEssay', Object.assign(studentParams(), {
          bookTitle: d.book.trim(), finishDate: d.finishDate, reviewTitle: d.title.trim(), paragraphs: d.paras
        }));
        const complete = d.paras.every(p => p.trim());
        saveMsg.textContent = complete
          ? '5문단을 모두 써서 독서록 권수에 들어갔어요. 👍'
          : '작성 중으로 저장했어요. 5문단을 모두 쓰면 독서록 권수에 들어가요.';
        saveMsg.classList.add('show');
        renderEssayHistory();
        refresh();
      }catch(err){
        showError(err, errEl, '저장에 실패했어요. 다시 시도해주세요.');
      }finally{
        saveBtn.textContent = '독서기록장 저장하기';
        refresh();
      }
    });
  }

  function essayStatusBadge(e){
    if(e.recordType !== '온라인') return '<span class="badge done">' + esc(e.recordType) + ' · 선생님 확인</span>';
    return e.status === '확인완료' ? '<span class="badge done">✅ 완성</span>' : '<span class="badge draft">✍️ 작성 중</span>';
  }

  function renderEssayHistory(){
    const area = $('essayHistoryArea');
    if(!me){
      area.innerHTML = '<p class="side-title">내가 쓴 독서기록장</p><p class="side-sub">이름을 고르면 내가 쓴 글이 여기에 보여요.</p>';
      return;
    }
    if(essays.length === 0){
      area.innerHTML = '<p class="side-title">내가 쓴 독서기록장</p><p class="side-sub">아직 쓴 독서기록장이 없어요.</p>';
      return;
    }
    const done = essays.filter(e => e.status === '확인완료').length;
    const draft = essays.filter(e => e.status === '작성중').length;
    area.innerHTML = `
      <p class="side-title">내가 쓴 독서기록장 (완성 ${done}권${draft ? ' · 작성 중 ' + draft : ''})</p>
      <p class="side-sub">쓴 글이 한 편의 글로 보여요. 고치거나 이어서 쓰려면 버튼을 눌러요.</p>
      ${essays.map((e, i) => {
        const online = e.recordType === '온라인';
        const meta = [e.reviewTitle ? e.bookTitle : '', e.author, e.publisher, e.pages ? e.pages + '쪽' : ''].filter(Boolean).join(' · ');
        const body = online
          ? `<div class="essay-body">${e.paragraphs.filter(t => t.trim())
              .map(t => `<p>${esc(t.trim()).replace(/\n/g, '<br>')}</p>`).join('') || '<p style="color:var(--ink-soft);text-indent:0;">아직 쓴 문단이 없어요.</p>'}</div>`
          : `<div class="past-text" style="color:var(--ink-soft);">${esc(e.recordType)}으로 낸 독서록이에요.</div>`;
        return `
          <div class="past-card">
            <div class="past-date">${fmtDateKo(e.date)} 다 읽음 ${essayStatusBadge(e)}</div>
            <div class="essay-headline">${esc(e.reviewTitle || e.bookTitle)}</div>
            ${meta ? `<div class="past-meta">${esc(meta)}</div>` : ''}
            ${body}
            ${online ? `<button class="btn-ghost" type="button" data-edit="${i}">${e.status === '확인완료' ? '수정하기' : '이어서 쓰기'}</button>` : ''}
          </div>`;
      }).join('')}
    `;
    area.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = essays[Number(btn.getAttribute('data-edit'))];
        essayDraft = {
          book: e.bookTitle, finishDate: e.date <= TODAY ? e.date : TODAY,
          title: e.reviewTitle || '', paras: e.paragraphs.slice(0, 5)
        };
        essayNote = '';
        renderEssayForm();
        $('panel-essay').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function setBoardDate(d){

    $('boardDateInput').value = d;
    loadBoard();
  }
  $('boardDateInput').addEventListener('change', e => setBoardDate(e.target.value));
  $('prevDayBtn').addEventListener('click', () => setBoardDate(addDays(boardDate, -1)));
  $('nextDayBtn').addEventListener('click', () => setBoardDate(addDays(boardDate, 1)));
  $('jumpTodayBtn').addEventListener('click', () => setBoardDate(TODAY));

    btn.addEventListener('click', () => {
      boardSub = btn.getAttribute('data-sub');

  async function loadBoard(){
    const asked = boardDate;
    const ci = boardPicker && boardPicker.classInfo();
    if(hasClassInfo() && !ci){
      boardData = null;
      $('boardArea').innerHTML = '<p class="empty-note">학년과 반을 골라주세요.</p>';
      return;
    }
    $('boardArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      const params = { date: asked };
      if(ci){ params.grade = ci.grade; params.cls = ci.cls; }
      const data = await apiGet('getDashboard', params);
      if(asked !== boardDate) return;
      boardData = data;
      renderBoard();
    }catch(err){
      if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return; }
      $('boardArea').innerHTML = '<p class="error-text">현황을 불러오지 못했어요. 다시 시도해주세요.</p>';
    }
  }

  function renderBoard(){
    const area = $('boardArea');
    if(!boardData){ return; }
    const rows = boardData.rows;
    const dateSub = document.querySelector('.subtab[data-sub="date"]');
    dateSub.textContent = boardDate === TODAY ? '오늘 현황' : fmtShort(boardDate) + ' 현황';
    if(rows.length === 0){
      area.innerHTML = '<p class="empty-note">이 반에는 등록된 학생이 없어요.</p>';
      return;
    }
    const where = classTitle(boardData.grade, boardData.cls);
    const asOf = boardDate !== TODAY ? `<p class="hint-line">${fmtDateKo(boardDate)}까지의 기록이에요.</p>` : '';

    if(boardSub === 'books'){
      const total = rows.reduce((s, r) => s + r.essayCount, 0);
      const exempt = rows.reduce((s, r) => s + r.exemptCount, 0);
      area.innerHTML = `
        ${asOf}
        <div class="summary-bar">
          <span class="label">${esc(where)} 독서록 권수 (학급 전체 ${total}권${exempt ? ' · 면제권 사용 ' + exempt + '회' : ''})</span>
        </div>
        <div class="student-list">
          ${rows.map(r => `
            <div class="student-block">
              <div class="student-row books-row">
                <div class="top">
                  <span class="left"><span class="num">${esc(r.num)}</span><span class="name">${esc(r.name)}</span></span>
                  <span class="count-num">${r.essayCount}권</span>
                </div>
                ${(r.essayHand || r.exemptCount) ? `<div class="sub">${[r.essayOnline ? '온라인 ' + r.essayOnline + '권' : '', r.essayHand ? '손으로 쓴 독서록 ' + r.essayHand + '권' : '', r.exemptCount ? '면제권 ' + r.exemptCount + '회' : ''].filter(Boolean).join(' · ')}</div>` : ''}
                ${r.essayBooks.length ? `<div class="book-chips">${r.essayBooks.map(b =>
                  `<span class="chip">${esc(b.bookTitle || '(책 이름 없음)')}${b.kind === '손글씨' ? ' · 손으로 씀' : ''}</span>`).join('')}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>`;

    } else if(boardSub === 'count'){
      const max = Math.max(1, ...rows.map(r => r.recordCount));
      const total = rows.reduce((s, r) => s + r.recordCount, 0);
      const avg = (total / rows.length).toFixed(1);
      area.innerHTML = `
        ${asOf}
        <div class="summary-bar">
          <span class="label">${esc(where)} 매일 독서기록 횟수 (학급 전체 ${total}번 · 한 명 평균 ${avg}번)</span>
        </div>
        <div class="student-list">
          ${rows.map(r => `
            <div class="student-block">
              <div class="student-row count-row">
                <span class="left"><span class="num">${esc(r.num)}</span><span class="name" style="min-width:70px;">${esc(r.name)}</span></span>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.recordCount / max * 100)}%;"></div></div>
                ${r.streak >= 2 ? `<span class="streak-tag">🔥 ${r.streak}일 연속</span>` : ''}
                <span class="count-num">${r.recordCount}번</span>
              </div>
            </div>`).join('')}
        </div>`;

    } else {
      const done = rows.filter(r => r.doneOnDate).length;
      area.innerHTML = `
        <div class="summary-bar">
          <span class="label">${esc(where)} · ${boardDate === TODAY ? '오늘' : fmtDateKo(boardDate)} 매일 독서기록을 낸 사람</span>
          <span class="count">${done} / ${rows.length}명</span>
        </div>
        <div class="student-list">
          ${rows.map(r => {
            const e = r.entry;
            const detail = e
              ? `<div class="past-date">${esc(e.bookTitle || '(책 이름 없음)')} · ${esc(e.chapter)}</div>` +
                (e.recordType === '공책'
                  ? '<div class="past-text" style="color:var(--ink-soft);margin-top:6px;">공책에 기록했어요.</div>'
                  : `<div class="past-label">줄거리</div><div class="past-text">${esc(e.summary)}</div>
                     <div class="past-label">느낀 점</div><div class="past-text">${esc(e.impression)}</div>`)
              : '<div class="past-text" style="color:var(--ink-soft);">이 날짜에는 낸 기록이 없어요.</div>';
            return `
              <div class="student-block">
                <div class="student-row clickable">
                  <div class="left"><span class="caret">›</span><span class="num">${esc(r.num)}</span><span class="name">${esc(r.name)}</span></div>
                  <span class="badge ${r.doneOnDate ? 'done' : 'pending'}">${r.doneOnDate ? '제출완료' : '미제출'}</span>
                </div>
                <div class="student-detail">${detail}</div>
              </div>`;
          }).join('')}
        </div>`;
      area.querySelectorAll('.student-row.clickable').forEach(row => {
        row.addEventListener('click', () => row.closest('.student-block').classList.toggle('open'));
      });
    }
  }

  // =====================================================
  // 교사용 설정 (손으로 쓴 독서록 체크 / 면제권 사용 / 특이사항) - 교사 코드로 들어가요
  // =====================================================
  const TEACHER_KEY = 'readinglog.teacherCode';
  let teacherCode = '';
  try{ teacherCode = sessionStorage.getItem(TEACHER_KEY) || ''; }catch(e){}
  let tcPicker = null;
  let tView = null;                 // {grade, cls, rows}
  let tChecked = {};                // 체크한 학생 이름
  let tOpen = {};                   // 기록을 펼친 학생 이름
  let tTool = { type: '손글씨독서록', text: '', date: TODAY };
  let tMsg = '';

  const TOOLS = [
    { key: '손글씨독서록', label: '✏️ 손으로 쓴 독서록 +1권', field: '책 이름 (선택)', ph: '예: 마당을 나온 암탉', apply: '손으로 쓴 독서록 +1권 기록하기' },
    { key: '면제권', label: '🎟️ 면제권 사용 기록', field: '사유 (선택)', ph: '예: 현장체험학습으로 면제', apply: '면제권 사용 기록하기' },
    { key: '특이사항', label: '📝 특이사항 기록', field: '특이사항 내용 (꼭 적어요)', ph: '예: 독서록 제출이 늦어짐', apply: '특이사항 기록하기' }
  ];

  function setTeacherCode(c){
    teacherCode = c;
    try{ if(c) sessionStorage.setItem(TEACHER_KEY, c); else sessionStorage.removeItem(TEACHER_KEY); }catch(e){}
  }

  function renderTeacherLogin(state){
    const msg = state === 'wrong' ? '코드가 맞지 않아요.'
      : state === 'notset' ? '아직 교사 코드가 정해지지 않았어요. 구글 시트의 Settings 탭에서 TeacherCode 옆 칸에 코드를 먼저 적어주세요.'
      : state === 'error' ? '불러오지 못했어요. 다시 시도해주세요.'
      : '선생님만 쓸 수 있는 곳이에요. 교사 코드를 입력해주세요.';
    $('teacherArea').innerHTML = `
      <div class="teacher-login">
        <p class="note-box">${esc(msg)}</p>
        <div class="field">
          <label for="teacherCodeInput">교사 코드</label>
          <input type="text" id="teacherCodeInput" autocomplete="off">
        </div>
        <button class="btn-primary" id="teacherLoginBtn" type="button">들어가기</button>
      </div>`;
    const input = $('teacherCodeInput');
    const go = () => { const c = input.value.trim(); if(!c) return; setTeacherCode(c); renderTeacher(); };
    $('teacherLoginBtn').addEventListener('click', go);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  }

  // 오류를 처리했으면 true, 못 했으면 false
  function handleTeacherError(err){
    if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return true; }
    if(err && err.code === 'TEACHER_NOT_SET'){ setTeacherCode(''); renderTeacherLogin('notset'); return true; }
    if(err && err.code === 'TEACHER_CODE_WRONG'){ setTeacherCode(''); renderTeacherLogin('wrong'); return true; }
    return false;
  }

  function renderTeacher(){
    if(!teacherCode){ renderTeacherLogin(''); return; }
    $('teacherArea').innerHTML = `
      <div class="teacher-head">
        <p>손으로 쓴 독서록을 낸 친구를 체크해서 독서록 권수에 더하고, 면제권 사용 횟수와 특이사항을 기록해요. 명단, 책 목록, 코드는 구글 시트(Students, Books, Settings 탭)에서 고쳐요.</p>
        <button class="btn-ghost" id="teacherLogoutBtn" type="button">나가기</button>
      </div>
      <div id="tcPickerSlot"></div>
      <p class="save-msg" id="teacherMsg" style="margin:0 0 12px;"></p>
      <p class="error-text" id="teacherError" style="display:none;"></p>
      <div id="teacherBody"><p class="loading">불러오는 중...</p></div>
    `;
    $('teacherLogoutBtn').addEventListener('click', () => {
      setTeacherCode(''); tView = null; tChecked = {}; tOpen = {};
      renderTeacherLogin('');
    });
    tcPicker = makePicker('tc', false, () => { tChecked = {}; tOpen = {}; loadTeacherClass(); });
    defaultClassFor(tcPicker, true);
    remountPicker(tcPicker, 'tcPickerSlot');
    loadTeacherClass();
  }

  async function loadTeacherClass(){
    const ci = tcPicker && tcPicker.classInfo();
    if(hasClassInfo() && !ci){
      $('teacherBody').innerHTML = '<p class="empty-note">학년과 반을 골라주세요.</p>';
      return;
    }
    $('teacherBody').innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      tView = await apiPost('teacherClass', Object.assign({ teacherCode: teacherCode }, ci || {}));
      renderTeacherBody();
    }catch(err){
      if(!handleTeacherError(err)) renderTeacherLogin('error');
    }
  }

  function showTeacherMsg(text){
    const el = $('teacherMsg');
    if(!el) return;
    el.textContent = text;
    el.classList.toggle('show', !!text);
  }

  function renderTeacherBody(){
    const body = $('teacherBody');
    if(!body || !tView) return;
    const rows = tView.rows;
    if(rows.length === 0){ body.innerHTML = '<p class="empty-note">이 반에는 등록된 학생이 없어요.</p>'; return; }
    const tool = TOOLS.find(t => t.key === tTool.type);
    const nChecked = rows.filter(r => tChecked[r.name]).length;
    const allChecked = nChecked === rows.length;

    body.innerHTML = `
      <div class="t-toolbar">
        <p class="tb-title">체크한 친구들에게 한꺼번에 기록하기</p>
        <div class="t-types">
          ${TOOLS.map(t => `<button type="button" class="t-type${t.key === tTool.type ? ' active' : ''}" data-ttype="${t.key}">${t.label}</button>`).join('')}
        </div>
        <div class="t-tool-grid">
          <div class="field"><label for="tText">${tool.field}</label><input type="text" id="tText" placeholder="${esc(tool.ph)}" value="${esc(tTool.text)}"></div>
          <div class="field"><label for="tDate">날짜</label><input type="date" id="tDate" value="${esc(tTool.date)}" max="${TODAY}"></div>
        </div>
        <div class="field"><button class="btn-primary" id="tApplyBtn" type="button" disabled>${tool.apply}</button></div>
      </div>
      <p class="hint-line">${esc(classTitle(tView.grade, tView.cls))} · ${rows.length}명 — 이름 앞 칸을 체크하고 위에서 기록하기를 눌러요. "기록"을 누르면 그 친구의 기록이 보이고, 잘못한 건 취소할 수 있어요.</p>
      <div class="t-table">
        <div class="t-head">
          <span><input type="checkbox" class="t-check" id="tCheckAll"${allChecked ? ' checked' : ''}></span><span>번호</span><span>이름</span><span>독서록 권수</span><span>면제권</span><span>특이사항</span><span></span>
        </div>
        ${rows.map(r => `
          <div class="t-block${tOpen[r.name] ? ' open' : ''}" data-name="${esc(r.name)}">
            <div class="t-row">
              <span><input type="checkbox" class="t-check t-one" data-name="${esc(r.name)}"${tChecked[r.name] ? ' checked' : ''}></span>
              <span class="t-num">${esc(r.num)}</span>
              <span class="t-name">${esc(r.name)}</span>
              <span class="t-stat">독서록 <b>${r.onlineCount + r.handCount}</b>권 <small>(온라인 ${r.onlineCount} · 손으로 쓴 ${r.handCount})</small></span>
              <span class="t-stat">면제권 <b>${r.exemptCount}</b>회</span>
              <span class="t-stat">특이사항 <b>${r.memoCount}</b></span>
              <button class="btn-ghost t-more" type="button" data-name="${esc(r.name)}">기록 ${tOpen[r.name] ? '▴' : '▾'}</button>
            </div>
            <div class="t-logs">
              ${r.logs.length === 0 ? '<div class="t-log" style="color:var(--ink-soft);">아직 기록한 것이 없어요.</div>' : r.logs.map(l => `
                <div class="t-log${l.status === '유효' ? '' : ' cancelled'}">
                  <span><span class="tl-type">${esc(l.type)}</span>${esc(l.text)} <small style="color:var(--ink-soft);">· ${esc(l.date)}${l.status === '유효' ? '' : ' · 취소됨'}</small></span>
                  ${l.status === '유효' ? `<button class="btn-ghost t-cancel" type="button" data-row="${l.row}">취소</button>` : ''}
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    `;

    const applyBtn = $('tApplyBtn');
    function checkApply(){
      const n = rows.filter(r => tChecked[r.name]).length;
      applyBtn.disabled = !(n > 0 && (tTool.type !== '특이사항' || tTool.text.trim()));
      applyBtn.textContent = n > 0 ? `체크한 ${n}명에게 ${tool.apply}` : tool.apply;
    }
    checkApply();

    body.querySelectorAll('.t-type').forEach(b => b.addEventListener('click', () => {
      tTool.type = b.getAttribute('data-ttype'); tTool.text = ''; renderTeacherBody();
    }));
    $('tText').addEventListener('input', e => { tTool.text = e.target.value; checkApply(); });
    $('tDate').addEventListener('change', e => {
      if(!e.target.value || e.target.value > TODAY){ e.target.value = tTool.date; return; }
      tTool.date = e.target.value;
    });
    $('tCheckAll').addEventListener('change', e => {
      tChecked = {};
      if(e.target.checked) rows.forEach(r => { tChecked[r.name] = true; });
      body.querySelectorAll('.t-one').forEach(c => { c.checked = e.target.checked; });
      checkApply();
    });
    body.querySelectorAll('.t-one').forEach(c => c.addEventListener('change', () => {
      const nm = c.getAttribute('data-name');
      if(c.checked) tChecked[nm] = true; else delete tChecked[nm];
      $('tCheckAll').checked = rows.every(r => tChecked[r.name]);
      checkApply();
    }));
    body.querySelectorAll('.t-more').forEach(b => b.addEventListener('click', () => {
      const nm = b.getAttribute('data-name');
      if(tOpen[nm]) delete tOpen[nm]; else tOpen[nm] = true;
      renderTeacherBody();
    }));
    body.querySelectorAll('.t-cancel').forEach(b => b.addEventListener('click', async () => {
      showTeacherMsg('');
      $('teacherError').style.display = 'none';
      try{
        tView = await apiPost('teacherLogCancel', Object.assign({ teacherCode: teacherCode, row: Number(b.getAttribute('data-row')) }, { grade: tView.grade, cls: tView.cls }));
        showTeacherMsg('기록을 취소했어요.');
        renderTeacherBody();
      }catch(err){
        if(!handleTeacherError(err)) showError(err, $('teacherError'), '취소하지 못했어요. 다시 시도해주세요.');
      }
    }));
    applyBtn.addEventListener('click', async () => {
      const names = rows.filter(r => tChecked[r.name]).map(r => r.name);
      applyBtn.disabled = true;
      applyBtn.textContent = '기록 중...';
      showTeacherMsg('');
      $('teacherError').style.display = 'none';
      try{
        tView = await apiPost('teacherLogAdd', {
          teacherCode: teacherCode, grade: tView.grade, cls: tView.cls,
          type: tTool.type, text: tTool.text.trim(), date: tTool.date, names: names
        });
        tChecked = {};
        tTool.text = '';
        showTeacherMsg(`${names.length}명에게 "${tool.label.replace(/^\S+\s/, '')}"을(를) 기록했어요. ✅`);
        renderTeacherBody();
      }catch(err){
        if(!handleTeacherError(err)){ showError(err, $('teacherError'), '기록하지 못했어요. 다시 시도해주세요.'); checkApply(); }
      }
    });
  }

  // ---------- 큰 탭 바꾸기 ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      const target = tab.getAttribute('data-tab');
      $('panel-' + target).classList.add('active');
      document.body.setAttribute('data-tab', target);
      if(target === 'board'){
        if(boardPicker && me && !boardPicker.touched && hasClassInfo()){
          boardPicker.gv = toVal(me.grade); boardPicker.cv = toVal(me.cls);
          remountPicker(boardPicker, 'boardPickerSlot');
        }
        loadBoard(); // 들어올 때마다 최신 상태로
      }
      if(target === 'teacher') renderTeacher();
    });
  });

  // ---------- 시작 ----------
  async function init(){
    if(!SETUP_DONE){ showGate('setup'); return; }
    try{
      const data = await apiGet('getInit');
      roster = data.roster;
      books = data.books;
      currentBook = data.currentBook || '';
      hideGate();
      me = null;
      defaultClassFor(whoPicker, false);
      remountPicker(whoPicker, 'whoSlot');
      mountBoardPicker();
      renderRecordForm(); renderRecordHistory(); renderEssayForm(); renderEssayHistory();
    }catch(err){
      if(err && err.code === 'CODE_REQUIRED'){ showGate('code', classCode ? 'wrong' : ''); }
      else { showGate('error'); }
    }
  }
  init();
})();
</script>
</body>
</html>
