            <div class="past-date">${fmtDateKo(e.date)} 다 읽음 ${essayStatusBadge(e)}${edited}</div>
            <div class="essay-headline">${esc(e.reviewTitle || e.bookTitle)}</div>
            ${meta ? `<div class="past-meta">${esc(meta)}</div>` : ''}
            ${body}
            ${comment}
            ${btn}
          </div>`;
      }).join('')}
    `;
    area.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = essays[Number(btn.getAttribute('data-edit'))];
        essayDraft = draftFromEssay(e);
        essayNote = '';
        renderEssayForm();
        $('panel-essay').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // =====================================================
  // 현황판 (학년·반별: 독서록 권수 / 매일 독서기록 횟수 / 날짜별 현황)
  // =====================================================
  let boardDate = TODAY;
  let boardSub = 'books';
  let boardData = null;
  let boardPicker = null;

  $('boardDateInput').value = TODAY;
  $('boardDateInput').max = TODAY;

  function setBoardDate(d){
    if(!d || d > TODAY){ $('boardDateInput').value = boardDate; return; }
    boardDate = d;
    $('boardDateInput').value = d;
    loadBoard();
  }
  $('boardDateInput').addEventListener('change', e => setBoardDate(e.target.value));
  $('prevDayBtn').addEventListener('click', () => setBoardDate(addDays(boardDate, -1)));
  $('nextDayBtn').addEventListener('click', () => setBoardDate(addDays(boardDate, 1)));
  $('jumpTodayBtn').addEventListener('click', () => setBoardDate(TODAY));
  $('refreshBoardBtn').addEventListener('click', () => loadBoard());
  document.querySelectorAll('.subtab').forEach(btn => {
    btn.addEventListener('click', () => {
      boardSub = btn.getAttribute('data-sub');
      document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b === btn));
      renderBoard();
    });
  });

  // 우리 반 독서 명예의 전당 (선생님이 확인한 독서록 권수가 많은 순, 같은 권수는 공동 순위)
  function hallOfFameHtml(rows, where){
    const ranked = rows.map((r, i) => ({ r: r, i: i })).filter(x => x.r.essayCount > 0)
      .sort((a, b) => b.r.essayCount - a.r.essayCount || a.i - b.i);
    let rank = 0, prev = null;
    ranked.forEach((x, idx) => { if(x.r.essayCount !== prev){ rank = idx + 1; prev = x.r.essayCount; } x.rank = rank; });
    const shown = ranked.filter(x => x.rank <= 5);
    const top = shown.slice(0, 10);
    const more = shown.length - top.length;
    const title = `🏆 ${esc(where)} 독서 명예의 전당 <small>(선생님이 확인한 독서록 기준)</small>`;
    if(top.length === 0){
      return `<div class="hall"><p class="hall-title">${title}</p><p class="hall-empty">아직 독서록 권수에 들어간 친구가 없어요. 첫 번째 주인공이 되어 볼까요?</p></div>`;
    }
    return `<div class="hall"><p class="hall-title">${title}</p>
      <div class="hall-row">${top.map(x => `<div class="hall-card rank${Math.min(x.rank, 4)}"><span class="hall-rank">${x.rank}위</span><span class="hall-name">${esc(x.r.name)}</span><span class="hall-count">${x.r.essayCount}권</span></div>`).join('')}</div>
      ${more > 0 ? `<p class="hint-line" style="margin-top:8px;">같은 권수의 친구가 ${more}명 더 있어요.</p>` : ''}</div>`;
  }

  function mountBoardPicker(){
    boardPicker = makePicker('board', false, () => loadBoard());
    defaultClassFor(boardPicker, true);
    remountPicker(boardPicker, 'boardPickerSlot');
  }

  async function loadBoard(){
    const asked = boardDate;
    const ci = boardPicker && boardPicker.classInfo();
    if(hasClassInfo() && !ci){
      boardData = null;
      $('boardArea').innerHTML = '<p class="empty-note">학년과 반을 골라주세요.</p>';
      return;
    }
    $('boardArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      const params = { date: asked };
      if(ci){ params.grade = ci.grade; params.cls = ci.cls; }
      const data = await apiGet('getDashboard', params);
      if(asked !== boardDate) return;
      boardData = data;
      renderBoard();
    }catch(err){
      if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return; }
      $('boardArea').innerHTML = '<p class="error-text">현황을 불러오지 못했어요. 다시 시도해주세요.</p>';
    }
  }

  function renderBoard(){
    const area = $('boardArea');
    if(!boardData){ return; }
    const rows = boardData.rows;
    const dateSub = document.querySelector('.subtab[data-sub="date"]');
    dateSub.textContent = boardDate === TODAY ? '오늘 현황' : fmtShort(boardDate) + ' 현황';
    if(rows.length === 0){
      area.innerHTML = '<p class="empty-note">이 반에는 등록된 학생이 없어요.</p>';
      return;
    }
    const where = classTitle(boardData.grade, boardData.cls);
    const asOf = boardDate !== TODAY ? `<p class="hint-line">${fmtDateKo(boardDate)}까지의 기록이에요.</p>` : '';

    if(boardSub === 'books'){
      const total = rows.reduce((s, r) => s + r.essayCount, 0);
      const exempt = rows.reduce((s, r) => s + r.exemptCount, 0);
      area.innerHTML = `
        ${asOf}
        ${hallOfFameHtml(rows, where)}
        <div class="summary-bar">
          <span class="label">${esc(where)} 독서록 권수 (학급 전체 ${total}권${exempt ? ' · 면제권 사용 ' + exempt + '회' : ''})</span>
        </div>
        <div class="student-list">
          ${rows.map(r => `
            <div class="student-block">
              <div class="student-row books-row">
                <div class="top">
                  <span class="left"><span class="num">${esc(r.num)}</span><span class="name">${esc(r.name)}</span></span>
                  <span class="count-num">${r.essayCount}권</span>
                </div>
                ${(r.essayHand || r.exemptCount) ? `<div class="sub">${[r.essayOnline ? '온라인 ' + r.essayOnline + '권' : '', r.essayHand ? '손으로 쓴 독서록 ' + r.essayHand + '권' : '', r.exemptCount ? '면제권 ' + r.exemptCount + '회' : ''].filter(Boolean).join(' · ')}</div>` : ''}
                ${r.essayBooks.length ? `<div class="book-chips">${r.essayBooks.map(b =>
                  `<span class="chip">${esc(b.bookTitle || '(책 이름 없음)')}${b.kind === '손글씨' ? ' · 손으로 씀' : ''}</span>`).join('')}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>`;

    } else if(boardSub === 'count'){
      const max = Math.max(1, ...rows.map(r => r.recordCount));
      const total = rows.reduce((s, r) => s + r.recordCount, 0);
      const avg = (total / rows.length).toFixed(1);
      area.innerHTML = `
        ${asOf}
        <div class="summary-bar">
          <span class="label">${esc(where)} 매일 독서기록 횟수 (학급 전체 ${total}번 · 한 명 평균 ${avg}번)</span>
        </div>
        <div class="student-list">
          ${rows.map(r => `
            <div class="student-block">
              <div class="student-row count-row">
                <span class="left"><span class="num">${esc(r.num)}</span><span class="name" style="min-width:70px;">${esc(r.name)}</span></span>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.recordCount / max * 100)}%;"></div></div>
                ${r.streak >= 2 ? `<span class="streak-tag">🔥 ${r.streak}일 연속</span>` : ''}
                <span class="count-num">${r.recordCount}번</span>
              </div>
            </div>`).join('')}
        </div>`;

    } else {
      const done = rows.filter(r => r.doneOnDate).length;
      area.innerHTML = `
        <div class="summary-bar">
          <span class="label">${esc(where)} · ${boardDate === TODAY ? '오늘' : fmtDateKo(boardDate)} 매일 독서기록을 낸 사람</span>
          <span class="count">${done} / ${rows.length}명</span>
        </div>
        <div class="student-list">
          ${rows.map(r => {
            const e = r.entry;
            const detail = e
              ? `<div class="past-date">${esc(e.bookTitle || '(책 이름 없음)')} · ${esc(e.chapter)}</div>` +
                (e.recordType === '공책'
                  ? '<div class="past-text" style="color:var(--ink-soft);margin-top:6px;">공책에 기록했어요.</div>'
                  : `<div class="past-label">줄거리</div><div class="past-text">${esc(e.summary)}</div>
                     <div class="past-label">느낀 점</div><div class="past-text">${esc(e.impression)}</div>`)
              : '<div class="past-text" style="color:var(--ink-soft);">이 날짜에는 낸 기록이 없어요.</div>';
            return `
              <div class="student-block">
                <div class="student-row clickable">
                  <div class="left"><span class="caret">›</span><span class="num">${esc(r.num)}</span><span class="name">${esc(r.name)}</span></div>
                  <span class="badge ${r.doneOnDate ? 'done' : 'pending'}">${r.doneOnDate ? '제출완료' : '미제출'}</span>
                </div>
                <div class="student-detail">${detail}</div>
              </div>`;
          }).join('')}
        </div>`;
      area.querySelectorAll('.student-row.clickable').forEach(row => {
        row.addEventListener('click', () => row.closest('.student-block').classList.toggle('open'));
      });
    }
  }

  // =====================================================
  // 교사용 설정 (선생님 코드로 들어가요)
  //   - 독서기록장 검토: 확인(권수 +1) / 수정 요청 / 코멘트 / 글 직접 고치기
  //   - 손으로 쓴 독서록 체크 / 면제권 사용 / 특이사항
  // =====================================================
  const TEACHER_KEY = 'readinglog.teacherCode';
  let teacherCode = '';
  try{ teacherCode = sessionStorage.getItem(TEACHER_KEY) || ''; }catch(e){}
  let teacherInfo = null;           // {name, all, classes}
  let tcPicker = null;
  let tView = null;                 // 한 반의 학생별 현황 (손글씨·면제권·특이사항)
  let tEssays = null;               // 한 반의 독서기록장 검토 목록
  let tSub = 'review';              // review | tools
  let tFilter = 'submitted';        // submitted | revise | confirmed | all
  let tChecked = {};                // 체크한 학생 이름
  let tOpen = {};                   // 기록을 펼친 학생 이름
  let tEssayOpen = {};              // 펼친 독서기록장
  let tEssayEdit = {};              // 고쳐 쓰기 중인 독서기록장
  let tTool = { type: '손글씨독서록', text: '', date: TODAY };

  const TOOLS = [
    { key: '손글씨독서록', label: '✏️ 손으로 쓴 독서록 +1권', field: '책 이름 (선택)', ph: '예: 마당을 나온 암탉', apply: '손으로 쓴 독서록 +1권 기록하기' },
    { key: '면제권', label: '🎟️ 면제권 사용 기록', field: '사유 (선택)', ph: '예: 현장체험학습으로 면제', apply: '면제권 사용 기록하기' },
    { key: '특이사항', label: '📝 특이사항 기록', field: '특이사항 내용 (꼭 적어요)', ph: '예: 독서록 제출이 늦어짐', apply: '특이사항 기록하기' }
  ];

  function setTeacherCode(c){
    teacherCode = c;
    try{ if(c) sessionStorage.setItem(TEACHER_KEY, c); else sessionStorage.removeItem(TEACHER_KEY); }catch(e){}
  }

  function renderTeacherLogin(state){
    const msg = state === 'wrong' ? '코드가 맞지 않아요.'
      : state === 'notset' ? '아직 선생님 코드가 정해지지 않았어요. 구글 시트의 Teachers 탭에 선생님 이름과 코드를 적거나, Settings 탭의 TeacherCode 옆 칸에 코드를 적어주세요.'
      : state === 'error' ? '불러오지 못했어요. 다시 시도해주세요.'
      : '선생님만 쓸 수 있는 곳이에요. 내 선생님 코드를 입력해주세요.';
    $('teacherArea').innerHTML = `
      <div class="teacher-login">
        <p class="note-box">${esc(msg)}</p>
        <div class="field">
          <label for="teacherCodeInput">선생님 코드</label>
          <input type="text" id="teacherCodeInput" autocomplete="off">
        </div>
        <button class="btn-primary" id="teacherLoginBtn" type="button">들어가기</button>
      </div>`;
    const input = $('teacherCodeInput');
    const go = () => { const c = input.value.trim(); if(!c) return; setTeacherCode(c); renderTeacher(); };
    $('teacherLoginBtn').addEventListener('click', go);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  }

  // 오류를 처리했으면 true, 못 했으면 false
  function handleTeacherError(err){
    if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return true; }
    if(err && err.code === 'TEACHER_NOT_SET'){ setTeacherCode(''); renderTeacherLogin('notset'); return true; }
    if(err && err.code === 'TEACHER_CODE_WRONG'){ setTeacherCode(''); renderTeacherLogin('wrong'); return true; }
    return false;
  }

  function showTeacherMsg(text){
    const el = $('teacherMsg');
    if(!el) return;
    el.textContent = text;
    el.classList.toggle('show', !!text);
  }
  function teacherParams(extra){
    const ci = tcPicker && tcPicker.classInfo();
    return Object.assign({ teacherCode: teacherCode }, ci || {}, extra || {});
  }

  async function renderTeacher(){
    if(!teacherCode){ teacherInfo = null; renderTeacherLogin(''); return; }
    tSub = 'review'; tFilter = 'submitted';      // 들어올 때마다 "확인 대기" 목록부터 보여준다
    $('teacherArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      const first = await apiPost('teacherClass', { teacherCode: teacherCode });   // 선생님 정보와 기본 반
      teacherInfo = first.teacher;
      tView = first;
      tChecked = {}; tOpen = {}; tEssayOpen = {}; tEssayEdit = {};
      buildTeacherShell(first);
      await loadTeacherEssays();
      renderTeacherBody();
    }catch(err){
      if(!handleTeacherError(err)) renderTeacherLogin('error');
    }
  }

  function buildTeacherShell(first){
    const who = teacherInfo.all ? '모든 반' : teacherInfo.classes.map(c => classTitle(c.grade, c.cls)).join(', ');
    $('teacherArea').innerHTML = `
      <div class="teacher-head">
        <p><b>${esc(teacherInfo.name)} 선생님</b> 안녕하세요! (${esc(who)})<br>학생이 제출한 독서기록장을 확인하면 독서록 권수가 올라가요. 명단, 책 목록, 선생님 코드는 구글 시트(Students, Books, Teachers, Settings 탭)에서 고쳐요.</p>
        <button class="btn-ghost" id="teacherLogoutBtn" type="button">나가기</button>
      </div>
      <div id="tcPickerSlot"></div>
      <div class="subtabs" id="teacherSubtabs">
        <button class="subtab" data-tsub="review" type="button" id="tSubReview">독서기록장 검토</button>
        <button class="subtab" data-tsub="tools" type="button">손글씨 · 면제권 · 특이사항</button>
      </div>
      <p class="save-msg" id="teacherMsg" style="margin:0 0 12px;"></p>
      <p class="error-text" id="teacherError" style="display:none;"></p>
      <div id="teacherBody"></div>
    `;
    $('teacherLogoutBtn').addEventListener('click', () => {
      setTeacherCode(''); teacherInfo = null; tView = null; tEssays = null;
      renderTeacherLogin('');
    });
    tcPicker = makePicker('tc', false, () => {
      tChecked = {}; tOpen = {}; tEssayOpen = {}; tEssayEdit = {};
      reloadTeacherAll();
    });
    tcPicker.allowed = teacherInfo.all ? null : teacherInfo.classes;
    tcPicker.gv = toVal(first.grade); tcPicker.cv = toVal(first.cls);
    remountPicker(tcPicker, 'tcPickerSlot');
    $('teacherSubtabs').querySelectorAll('[data-tsub]').forEach(b => {
      b.addEventListener('click', async () => {
        tSub = b.getAttribute('data-tsub');
        if(tSub === 'tools') await loadTeacherView();
        renderTeacherBody();
      });
    });
  }

  async function loadTeacherEssays(){
    const ci = tcPicker && tcPicker.classInfo();
    if(hasClassInfo() && !ci){ tEssays = null; return; }
    tEssays = await apiPost('teacherEssays', teacherParams());
  }
  async function loadTeacherView(){
    const ci = tcPicker && tcPicker.classInfo();
    if(hasClassInfo() && !ci){ tView = null; return; }
    tView = await apiPost('teacherClass', teacherParams());
  }
  async function reloadTeacherAll(){
    const body = $('teacherBody');
    const ci = tcPicker && tcPicker.classInfo();
    if(hasClassInfo() && !ci){ body.innerHTML = '<p class="empty-note">학년과 반을 골라주세요.</p>'; return; }
    body.innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      await Promise.all([loadTeacherEssays(), loadTeacherView()]);
      renderTeacherBody();
    }catch(err){
      if(!handleTeacherError(err)) body.innerHTML = '<p class="error-text">불러오지 못했어요. 다시 시도해주세요.</p>';
    }
  }

  function renderTeacherBody(){
    const body = $('teacherBody');
    if(!body) return;
    const nSubmitted = tEssays ? tEssays.counts.submitted : 0;
    $('tSubReview').textContent = '독서기록장 검토' + (nSubmitted ? ` (확인 대기 ${nSubmitted})` : '');
    $('teacherSubtabs').querySelectorAll('[data-tsub]').forEach(b => b.classList.toggle('active', b.getAttribute('data-tsub') === tSub));
    if(!tEssays && !tView){ body.innerHTML = '<p class="empty-note">학년과 반을 골라주세요.</p>'; return; }
    if(tSub === 'review') renderTeacherReview(); else renderTeacherTools();
  }

  // ---------- 독서기록장 검토 ----------
  const REVIEW_FILTERS = [
    { key: 'submitted', label: '확인 대기', count: c => c.submitted },
    { key: 'revise', label: '수정 요청함', count: c => c.revise },
    { key: 'confirmed', label: '확인 완료', count: c => c.confirmed },
    { key: 'all', label: '전체', count: c => c.submitted + c.revise + c.confirmed }
  ];
  const FILTER_STATUS = { submitted: ['제출함'], revise: ['수정요청'], confirmed: ['확인완료'], all: ['제출함', '수정요청', '확인완료'] };

  function essayKey(it){ return it.name + '##' + bookKey(it.bookTitle); }
  function essayTextHtml(it){
    const meta = [it.reviewTitle ? it.bookTitle : '', it.author, it.publisher, it.pages ? it.pages + '쪽' : ''].filter(Boolean).join(' · ');
    return `
      <div class="essay-headline">${esc(it.reviewTitle || it.bookTitle)}</div>
      ${meta ? `<div class="past-meta">${esc(meta)}</div>` : ''}
      <div class="essay-body">${it.paragraphs.filter(t => t.trim()).map(t => `<p>${esc(t.trim()).replace(/\n/g, '<br>')}</p>`).join('')}</div>`;
  }
  function essayEditHtml(it){
    return `
      <div class="field"><label>서평 제목</label><input type="text" class="rv-title" value="${esc(it.reviewTitle)}"></div>
      ${ESSAY_PARAS.map((p, i) => `<div class="field"><label>${i + 1}문단 · ${p.title}</label><textarea class="rv-para" data-i="${i}" style="min-height:90px;">${esc(it.paragraphs[i])}</textarea></div>`).join('')}`;
  }
  function reviewBadge(it){
    if(it.status === '확인완료') return '<span class="badge done">✅ 확인 완료</span>';
    if(it.status === '수정요청') return '<span class="badge warn">↩️ 수정 요청함</span>';
    return '<span class="badge pending">⏳ 확인 대기</span>';
  }

  function renderTeacherReview(){
    const body = $('teacherBody');
    if(!tEssays){ body.innerHTML = '<p class="empty-note">학년과 반을 골라주세요.</p>'; return; }
    const c = tEssays.counts;
    const items = tEssays.items.filter(it => FILTER_STATUS[tFilter].indexOf(it.status) >= 0);
    body.innerHTML = `
      <div class="subtabs">
        ${REVIEW_FILTERS.map(f => `<button type="button" class="subtab${tFilter === f.key ? ' active' : ''}" data-filter="${f.key}">${f.label} ${f.count(c)}</button>`).join('')}
      </div>
      <p class="hint-line">${esc(classTitle(tEssays.grade, tEssays.cls))} · 아직 쓰는 중인 글 ${c.draft}편은 학생이 제출하면 여기에 나타나요.</p>
      ${items.length === 0 ? '<p class="empty-note">이 목록에는 독서기록장이 없어요.</p>' : items.map(it => {
        const key = essayKey(it);
        const open = !!tEssayOpen[key];
        const editing = !!tEssayEdit[key];
        const confirmed = it.status === '확인완료';
        return `
          <div class="review-card${open ? ' open' : ''}" data-key="${esc(key)}">
            <div class="review-head" data-toggle="${esc(key)}">
              <span class="caret">›</span>
              <span class="rv-who">${esc(it.num ? it.num + '번 ' : '')}${esc(it.name)}</span>
              <span class="rv-book">『${esc(it.bookTitle)}』</span>
              ${reviewBadge(it)}
              ${it.teacherEdited ? '<span class="badge draft">✏️ 선생님이 고침</span>' : ''}
              <span class="rv-date">${esc(it.date)} 다 읽음</span>
            </div>
            <div class="review-body">
              ${editing ? essayEditHtml(it) : essayTextHtml(it)}
              ${it.note || !editing ? `<div class="field" style="margin-top:12px;"><label>코멘트 <span class="opt">(학생에게 보여요${it.teacherName ? ' · 마지막: ' + esc(it.teacherName) + ' 선생님' : ''})</span></label><textarea class="rv-note" style="min-height:70px;">${esc(it.note)}</textarea></div>` : ''}
              <div class="t-actions">
                ${editing
                  ? '<button class="btn-primary rv-save-edit" type="button">고친 글 저장</button><button class="btn-ghost rv-cancel-edit" type="button">취소</button>'
                  : (confirmed
                      ? '<button class="btn-ghost rv-comment" type="button">💬 코멘트만 저장</button><button class="btn-ghost rv-edit" type="button">✏️ 글 직접 고치기</button><button class="btn-ghost rv-reopen" type="button">확인 취소</button>'
                      : '<button class="btn-primary rv-confirm" type="button">✅ 확인하기 (권수 +1)</button><button class="btn-ghost rv-revise" type="button">↩️ 수정 요청</button><button class="btn-ghost rv-comment" type="button">💬 코멘트만 저장</button><button class="btn-ghost rv-edit" type="button">✏️ 글 직접 고치기</button>')}
              </div>
            </div>
          </div>`;
      }).join('')}
    `;
    body.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { tFilter = b.getAttribute('data-filter'); renderTeacherReview(); }));
    body.querySelectorAll('.review-card').forEach(card => {
      const key = card.getAttribute('data-key');
      const it = tEssays.items.find(x => essayKey(x) === key);
      const noteEl = () => card.querySelector('.rv-note');
      const noteVal = () => noteEl() ? noteEl().value.trim() : '';
      card.querySelector('.review-head').addEventListener('click', () => {
        if(tEssayOpen[key]) delete tEssayOpen[key]; else tEssayOpen[key] = true;
        card.classList.toggle('open', !!tEssayOpen[key]);
      });
      const on = (cls, fn) => { const b = card.querySelector(cls); if(b) b.addEventListener('click', fn); };
      on('.rv-confirm', () => essayAct(it, 'confirm', { note: noteVal() }, `${it.name} 학생의 독서기록장을 확인했어요. 독서록 권수가 올라갔어요. ✅`));
      on('.rv-revise', () => {
        if(!noteVal()){ const el = $('teacherError'); el.textContent = '다시 쓸 부분을 코멘트에 적어주세요.'; el.style.display = 'block'; noteEl().focus(); return; }
        essayAct(it, 'revise', { note: noteVal() }, `${it.name} 학생에게 고쳐 쓰라고 돌려보냈어요.`);
      });
      on('.rv-comment', () => {
        if(!noteVal()){ const el = $('teacherError'); el.textContent = '코멘트를 적어주세요.'; el.style.display = 'block'; noteEl().focus(); return; }
        essayAct(it, 'comment', { note: noteVal() }, '코멘트를 저장했어요. 학생에게 보여요. 💬');
      });
      on('.rv-reopen', () => essayAct(it, 'reopen', {}, '확인을 취소했어요. 권수가 되돌아갔어요.'));
      on('.rv-edit', () => { tEssayEdit[key] = true; tEssayOpen[key] = true; renderTeacherReview(); });
      on('.rv-cancel-edit', () => { delete tEssayEdit[key]; renderTeacherReview(); });
      on('.rv-save-edit', () => {
        const paras = [...card.querySelectorAll('.rv-para')].map(t => t.value);
        delete tEssayEdit[key];
        essayAct(it, 'edit', { paragraphs: paras, reviewTitle: card.querySelector('.rv-title').value, note: noteVal() }, '글을 고쳐서 저장했어요. 학생에게 "선생님이 고쳐 줬어요"로 보여요. ✏️');
      });
    });
  }

  async function essayAct(it, decision, extra, okMsg){
    showTeacherMsg('');
    const errEl = $('teacherError');
    errEl.style.display = 'none';
    try{
      tEssays = await apiPost('teacherEssayAct', teacherParams(Object.assign({ row: it.row, decision: decision }, extra)));
      tView = null;           // 권수가 바뀌었을 수 있으니 다음에 열 때 새로 불러온다
      showTeacherMsg(okMsg);
      renderTeacherBody();
    }catch(err){
      if(!handleTeacherError(err)){ showError(err, errEl, '처리하지 못했어요. 새로고침해서 다시 해주세요.'); renderTeacherReview(); }
    }
  }

  // ---------- 손글씨 · 면제권 · 특이사항 ----------
  function renderTeacherTools(){
    const body = $('teacherBody');
    if(!tView){ body.innerHTML = '<p class="loading">불러오는 중...</p>'; loadTeacherView().then(() => renderTeacherBody()).catch(() => { body.innerHTML = '<p class="error-text">불러오지 못했어요. 다시 시도해주세요.</p>'; }); return; }
    const rows = tView.rows;
    if(rows.length === 0){ body.innerHTML = '<p class="empty-note">이 반에는 등록된 학생이 없어요.</p>'; return; }
    const tool = TOOLS.find(t => t.key === tTool.type);
    const nChecked = rows.filter(r => tChecked[r.name]).length;
    const allChecked = nChecked === rows.length;

    body.innerHTML = `
      <div class="t-toolbar">
        <p class="tb-title">체크한 친구들에게 한꺼번에 기록하기</p>
        <p class="hint-line">손으로 쓴 독서록은 같은 책(띄어쓰기가 달라도)을 한 권으로만 세요. 이미 권수에 들어간 책은 자동으로 건너뛰어요.</p>
        <div class="t-types">
          ${TOOLS.map(t => `<button type="button" class="t-type${t.key === tTool.type ? ' active' : ''}" data-ttype="${t.key}">${t.label}</button>`).join('')}
        </div>
        <div class="t-tool-grid">
          <div class="field"><label for="tText">${tool.field}</label><input type="text" id="tText" placeholder="${esc(tool.ph)}" value="${esc(tTool.text)}"></div>
          <div class="field"><label for="tDate">날짜</label><input type="date" id="tDate" value="${esc(tTool.date)}" max="${TODAY}"></div>
        </div>
        <div class="field"><button class="btn-primary" id="tApplyBtn" type="button" disabled>${tool.apply}</button></div>
      </div>
      <p class="hint-line">${esc(classTitle(tView.grade, tView.cls))} · ${rows.length}명 — 이름 앞 칸을 체크하고 위에서 기록하기를 눌러요. "기록"을 누르면 그 친구의 기록이 보이고, 잘못한 건 취소할 수 있어요.</p>
      <div class="t-table">
        <div class="t-head">
          <span><input type="checkbox" class="t-check" id="tCheckAll"${allChecked ? ' checked' : ''}></span><span>번호</span><span>이름</span><span>독서록 권수</span><span>면제권</span><span>특이사항</span><span></span>
        </div>
        ${rows.map(r => `
          <div class="t-block${tOpen[r.name] ? ' open' : ''}" data-name="${esc(r.name)}">
            <div class="t-row">
              <span><input type="checkbox" class="t-check t-one" data-name="${esc(r.name)}"${tChecked[r.name] ? ' checked' : ''}></span>
              <span class="t-num">${esc(r.num)}</span>
              <span class="t-name">${esc(r.name)}</span>
              <span class="t-stat">독서록 <b>${r.onlineCount + r.handCount}</b>권 <small>(온라인 ${r.onlineCount} · 손으로 쓴 ${r.handCount})</small></span>
              <span class="t-stat">면제권 <b>${r.exemptCount}</b>회</span>
              <span class="t-stat">특이사항 <b>${r.memoCount}</b></span>
              <button class="btn-ghost t-more" type="button" data-name="${esc(r.name)}">기록 ${tOpen[r.name] ? '▴' : '▾'}</button>
            </div>
            <div class="t-logs">
              ${r.logs.length === 0 ? '<div class="t-log" style="color:var(--ink-soft);">아직 기록한 것이 없어요.</div>' : r.logs.map(l => `
                <div class="t-log${l.status === '유효' ? '' : ' cancelled'}">
                  <span><span class="tl-type">${esc(l.type)}</span>${esc(l.text)} <small style="color:var(--ink-soft);">· ${esc(l.date)}${l.status === '유효' ? '' : ' · 취소됨'}</small></span>
                  ${l.status === '유효' ? `<button class="btn-ghost t-cancel" type="button" data-row="${l.row}">취소</button>` : ''}
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    `;

    const applyBtn = $('tApplyBtn');
    function checkApply(){
      const n = rows.filter(r => tChecked[r.name]).length;
      applyBtn.disabled = !(n > 0 && (tTool.type !== '특이사항' || tTool.text.trim()));
      applyBtn.textContent = n > 0 ? `체크한 ${n}명에게 ${tool.apply}` : tool.apply;
    }
    checkApply();

    body.querySelectorAll('.t-type').forEach(b => b.addEventListener('click', () => {
      tTool.type = b.getAttribute('data-ttype'); tTool.text = ''; renderTeacherTools();
    }));
    $('tText').addEventListener('input', e => { tTool.text = e.target.value; checkApply(); });
    $('tDate').addEventListener('change', e => {
      if(!e.target.value || e.target.value > TODAY){ e.target.value = tTool.date; return; }
      tTool.date = e.target.value;
    });
    $('tCheckAll').addEventListener('change', e => {
      tChecked = {};
      if(e.target.checked) rows.forEach(r => { tChecked[r.name] = true; });
      body.querySelectorAll('.t-one').forEach(c => { c.checked = e.target.checked; });
      checkApply();
    });
    body.querySelectorAll('.t-one').forEach(c => c.addEventListener('change', () => {
      const nm = c.getAttribute('data-name');
      if(c.checked) tChecked[nm] = true; else delete tChecked[nm];
      $('tCheckAll').checked = rows.every(r => tChecked[r.name]);
      checkApply();
    }));
    body.querySelectorAll('.t-more').forEach(b => b.addEventListener('click', () => {
      const nm = b.getAttribute('data-name');
      if(tOpen[nm]) delete tOpen[nm]; else tOpen[nm] = true;
      renderTeacherTools();
    }));
    body.querySelectorAll('.t-cancel').forEach(b => b.addEventListener('click', async () => {
      showTeacherMsg('');
      $('teacherError').style.display = 'none';
      try{
        tView = await apiPost('teacherLogCancel', teacherParams({ row: Number(b.getAttribute('data-row')) }));
        showTeacherMsg('기록을 취소했어요.');
        renderTeacherTools();
      }catch(err){
        if(!handleTeacherError(err)) showError(err, $('teacherError'), '취소하지 못했어요. 다시 시도해주세요.');
      }
    }));
    applyBtn.addEventListener('click', async () => {
      const names = rows.filter(r => tChecked[r.name]).map(r => r.name);
      applyBtn.disabled = true;
      applyBtn.textContent = '기록 중...';
      showTeacherMsg('');
      $('teacherError').style.display = 'none';
      try{
        tView = await apiPost('teacherLogAdd', teacherParams({ type: tTool.type, text: tTool.text.trim(), date: tTool.date, names: names }));
        const skipped = tView.skipped || [];
        const added = tView.addedCount != null ? tView.addedCount : names.length;
        tChecked = {};
        tTool.text = '';
        let msg = added > 0
          ? `${added}명에게 "${tool.label.replace(/^\S+\s/, '')}"을(를) 기록했어요. ✅`
          : '기록한 친구가 없어요.';
        if(skipped.length) msg += ` 이미 권수에 들어간 책이라 건너뛴 친구: ${skipped.join(', ')}`;
        showTeacherMsg(msg);
        renderTeacherTools();
      }catch(err){
        if(!handleTeacherError(err)){ showError(err, $('teacherError'), '기록하지 못했어요. 다시 시도해주세요.'); checkApply(); }
      }
    });
  }

  // ---------- 큰 탭 바꾸기 ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      const target = tab.getAttribute('data-tab');
      $('panel-' + target).classList.add('active');
      document.body.setAttribute('data-tab', target);
      stopSpeak();
      if(target === 'board'){
        if(boardPicker && me && !boardPicker.touched && hasClassInfo()){
          boardPicker.gv = toVal(me.grade); boardPicker.cv = toVal(me.cls);
          remountPicker(boardPicker, 'boardPickerSlot');
        }
        loadBoard(); // 들어올 때마다 최신 상태로
      }
      if(target === 'teacher') renderTeacher();
    });
  });

  // ---------- 시작 ----------
  async function init(){
    if(!SETUP_DONE){ showGate('setup'); return; }
    try{
      const data = await apiGet('getInit');
      roster = data.roster;
      books = data.books;
      currentBook = data.currentBook || '';
      hideGate();
      me = null;
      defaultClassFor(whoPicker, false);
      remountPicker(whoPicker, 'whoSlot');
      mountBoardPicker();
      renderRecordForm(); renderRecordHistory(); renderEssayForm(); renderEssayHistory();
    }catch(err){
      if(err && err.code === 'CODE_REQUIRED'){ showGate('code', classCode ? 'wrong' : ''); }
      else { showGate('error'); }
    }
  }
  init();
})();
</script>
</body>
</html>
