<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 독서기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EEDD;
    --surface:#FFFDF6;
    --surface-alt:#FBF6E9;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --line:rgba(43,38,32,0.16);
    --accent:#3B5D45;
    --accent-soft:#DCE6DC;
    --gold:#C68A3D;
    --gold-soft:#F5E9D6;
    --danger:#A8442E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:1020px; margin:0 auto; padding:40px 20px 80px; }

  .masthead{
    position:relative;
    background:var(--surface);
    border:1px solid var(--ink);
    border-radius:10px;
    padding:28px 26px;
    overflow:hidden;
  }
  .masthead::after{
    content:"";
    position:absolute; top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 34px 34px 0;
    border-color:transparent var(--gold) transparent transparent;
  }
  .masthead .today{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; }
  .masthead h1{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(26px,5vw,34px); line-height:1.25;
    margin:0 0 10px; max-width:90%;
  }
  .masthead .sub{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; margin:0; max-width:52ch; }

  /* 학년 · 반 · 이름 고르기 */
  .who-bar{
    margin-top:18px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px;
  }
  .who-bar .who-title{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; }
  .picker{ display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:10px; }
  .picker.no-name{ grid-template-columns:1fr 1fr; max-width:420px; }
  .pk-field label{ margin-bottom:4px; }
  select:disabled{ background:#F4F1E6; color:#9A9184; }
  body[data-tab="board"] .who-bar, body[data-tab="teacher"] .who-bar{ display:none; }

  .tabs{ display:flex; gap:4px; margin:20px 0 0; padding-left:4px; flex-wrap:wrap; }
  .tab{
    position:relative; top:1px;
    padding:10px 18px;
    border:1px solid var(--ink); border-bottom:none;
    border-radius:8px 8px 0 0;
    background:var(--bg); color:var(--ink-soft);
    font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--surface); color:var(--ink); font-weight:600; border-bottom:1px solid var(--surface); }
  .panel-wrap{ border:1px solid var(--ink); border-radius:0 8px 8px 8px; background:var(--surface); padding:28px 26px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* 처음 설정 / 입장 코드 / 오류 안내 */
  .gate-card{
    display:none;
    margin-top:26px;
    background:var(--surface); border:1px solid var(--ink); border-radius:10px;
    padding:28px 26px; max-width:520px;
  }
  body.gated .gate-card{ display:block; }
  body.gated .tabs, body.gated .panel-wrap, body.gated .who-bar{ display:none; }
  .gate-card h2{ font-family:'Fraunces', serif; font-size:20px; margin:0 0 10px; }
  .gate-card p{ font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin:0 0 14px; }
  .gate-card code{ background:#EFEBDD; padding:2px 6px; border-radius:4px; font-size:13px; }

  label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  label .opt{ font-weight:400; opacity:0.8; }
  select, input[type=text], input[type=date], textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    background:#fff; font-family:'Work Sans', sans-serif; font-size:15px; color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ min-height:100px; resize:vertical; line-height:1.6; }
  .field{ margin-bottom:18px; }
  .field-row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row2 .field{ margin-bottom:18px; }

  button{ font-family:'Work Sans', sans-serif; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; border:none; padding:12px 22px; border-radius:6px; font-weight:600; font-size:15px; }
  .btn-primary:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); padding:8px 14px; border-radius:6px; font-size:13.5px; }
  .btn-icon{ background:#fff; border:1px solid var(--line); color:var(--ink); width:38px; height:38px; border-radius:6px; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .empty-note{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; }
  .note-box{
    border:1px dashed var(--accent); background:var(--accent-soft); color:var(--accent);
    border-radius:8px; padding:10px 14px; font-size:13.5px; margin:0 0 18px;
  }
  .note-box.warn{ border-color:var(--danger); background:#F3E2DD; color:var(--danger); }
  .hint-line{ font-size:12.5px; color:var(--ink-soft); margin:0 0 8px; line-height:1.6; }
  .save-msg{ font-size:13.5px; color:var(--accent); margin-top:10px; display:none; }
  .save-msg.show{ display:block; }
  .loading, .error-text{ font-size:14px; color:var(--ink-soft); padding:12px 0; margin:0; }
  .error-text{ color:var(--danger); }

  /* 왼쪽 쓰기 / 오른쪽 지난 기록 */
  .split{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr); gap:32px; align-items:start; }
  .split-side{ border-left:1px dashed var(--line); padding-left:28px; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; }
  .side-title{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:0 0 4px; }
  .side-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }

  .past-card{ padding:14px 0; border-bottom:1px dashed var(--line); }
  .past-card:last-child{ border-bottom:none; }
  .past-card.is-current{ background:var(--accent-soft); margin:0 -10px; padding:14px 10px; border-radius:6px; }
  .past-date{ font-size:12px; color:var(--ink-soft); }
  .past-title{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; margin:2px 0 2px; }
  .past-meta{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; }
  .past-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:10px 0 2px; }
  .past-text{ font-size:14px; line-height:1.65; white-space:pre-wrap; }
  .past-card .btn-ghost{ margin-top:10px; }
  .badge{ font-size:12px; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .badge.done{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .badge.pending{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .badge.draft{ background:var(--gold-soft); color:var(--gold); font-weight:600; }

  /* 독서기록장 (서평 5문단) */
  .essay-body{ margin-top:8px; }
  .essay-body p{ margin:0 0 10px; font-size:14.5px; line-height:1.9; text-indent:1em; }
  .essay-body p:last-child{ margin-bottom:0; }
  .essay-headline{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; line-height:1.4; margin:4px 0 2px; }

  .title-card, .para-card{
    border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:16px 18px 18px; margin-bottom:16px;
  }
  .title-card{ background:var(--surface-alt); }
  .card-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .card-head h3{ font-family:'Fraunces', serif; font-size:16.5px; font-weight:600; margin:0; flex:1; }
  .para-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:13px; font-weight:600; flex-shrink:0;
  }
  .para-count{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .para-card.filled .para-num::after{ content:""; }
  .para-card.filled{ border-color:var(--accent); }
  .para-guide{ font-size:13.5px; line-height:1.65; color:var(--ink-soft); margin:0 0 10px; }

  details.tip{ margin:0 0 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface-alt); }
  details.tip summary{ cursor:pointer; font-size:13px; font-weight:600; color:var(--accent); padding:8px 12px; list-style:none; }
  details.tip summary::-webkit-details-marker{ display:none; }
  details.tip summary::before{ content:'▸  '; }
  details.tip[open] summary::before{ content:'▾  '; }
  details.tip .tip-body{ padding:2px 14px 12px; font-size:13.5px; line-height:1.75; }
  .tip-body .frame{ background:#fff; border:1px dashed var(--line); border-radius:6px; padding:8px 12px; margin:6px 0; }
  .tip-body .ex-label{ display:inline-block; font-size:11.5px; font-weight:600; color:var(--gold); background:var(--gold-soft); border-radius:10px; padding:1px 8px; margin-right:6px; }
  .tip-body ul{ margin:6px 0 0; padding-left:18px; }
  .tip-body li{ margin-bottom:4px; }
  .tip-body dl{ margin:6px 0 0; }
  .tip-body dt{ font-weight:600; margin-top:8px; }
  .tip-body dd{ margin:2px 0 0 0; color:var(--ink-soft); }
  .tip-body .ex-text{ margin-top:2px; color:var(--ink); }
  .tip-body .cat{ font-weight:600; margin:8px 0 4px; font-size:13px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .word-chip{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:20px; padding:3px 10px; font-size:12.5px;
  }
  .word-chip:hover{ border-color:var(--accent); color:var(--accent); }

  textarea.lined{
    min-height:150px; padding:6px 14px; line-height:30px; font-size:15px;
    background-color:#fff;
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 29px, rgba(43,38,32,0.14) 29px, rgba(43,38,32,0.14) 30px);
    background-position:0 6px; background-attachment:local;
  }

  .save-bar{
    position:sticky; bottom:0; z-index:5;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border-top:1px solid var(--ink);
    margin:8px -26px -28px; padding:12px 26px;
  }
  .save-bar .progress{ font-size:13px; color:var(--ink-soft); flex:1; min-width:150px; }
  .save-bar .bar-btns{ display:flex; gap:8px; flex-wrap:nowrap; align-items:center; }
  .save-bar .bar-btns .btn-primary, .save-bar .bar-btns .btn-ghost{ padding:10px 14px; white-space:nowrap; }
  .save-bar .progress b{ color:var(--accent); }
  .save-bar .save-msg{ width:100%; margin:0; }
  .save-bar .error-text{ width:100%; padding:0; }

  /* 현황판 */
  .board-top{ display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px; }
  .date-nav{ display:flex; align-items:center; gap:8px; width:300px; max-width:100%; }
  .date-nav input[type=date]{ flex:1; }
  .link-btn{ font-size:12.5px; color:var(--accent); background:none; border:none; font-weight:600; padding:0; margin:0 14px 18px 0; }
  .subtabs{ display:flex; gap:8px; margin:6px 0 20px; flex-wrap:wrap; }
  .subtab{
    padding:9px 16px; border:1px solid var(--line); border-radius:20px;
    background:#fff; color:var(--ink-soft); font-size:14px; font-weight:500;
  }
  .subtab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .summary-bar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .summary-bar .label{ font-size:14px; color:var(--ink-soft); }
  .summary-bar .count{ font-family:'Fraunces', serif; font-size:26px; color:var(--accent); font-weight:600; }

  .student-list{ border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .student-row{ background:var(--surface); padding:13px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
  .student-list .student-block:last-child .student-row{ border-bottom:none; }
  .student-row.clickable{ cursor:pointer; }
  .student-row .left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .student-row .name{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; white-space:nowrap; }
  .student-row .num{ font-size:12px; color:var(--ink-soft); min-width:22px; }
  .caret{ color:var(--ink-soft); font-size:14px; transition:transform 0.15s ease; }
  .student-block.open .caret{ transform:rotate(90deg); }
  .student-detail{ display:none; background:var(--surface-alt); padding:12px 18px 16px; border-bottom:1px solid var(--line); }
  .student-list .student-block:last-child .student-detail{ border-bottom:none; }
  .student-block.open .student-detail{ display:block; }

  .count-row{ gap:16px; }
  .count-row .bar-track{ flex:1; height:8px; background:#EFEBDD; border-radius:4px; overflow:hidden; min-width:40px; }
  .count-row .bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .count-num{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--accent); min-width:48px; text-align:right; }
  .streak-tag{ font-size:12.5px; color:var(--gold); white-space:nowrap; }
  .book-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-size:12.5px; color:var(--ink-soft); background:#EFEBDD; padding:3px 10px; border-radius:20px; }
  .books-row{ display:block; }
  .books-row .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .books-row .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* 교사용 설정 */
  .teacher-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .teacher-head p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.6; max-width:60ch; }
  .teacher-login{ max-width:420px; }
  .t-toolbar{ border:1px solid var(--ink); border-radius:10px; background:var(--surface-alt); padding:16px 18px 6px; margin-bottom:16px; }
  .t-toolbar .tb-title{ font-family:'Fraunces', serif; font-size:15.5px; font-weight:600; margin:0 0 10px; }
  .t-types{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .t-type{
    padding:9px 14px; border:1px solid var(--line); border-radius:20px; background:#fff;
    color:var(--ink-soft); font-size:13.5px; font-weight:500;
  }
  .t-type.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .t-tool-grid{ display:grid; grid-template-columns:1fr 180px; gap:12px; }
  .t-table{ border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .t-head, .t-row{ display:grid; grid-template-columns:34px 34px 1fr 1.5fr 0.8fr 0.8fr 78px; gap:8px; align-items:center; padding:10px 14px; }
  .t-head{ background:var(--surface-alt); font-size:12px; color:var(--ink-soft); font-weight:600; border-bottom:1px solid var(--line); }
  .t-row{ background:var(--surface); border-bottom:1px solid var(--line); font-size:14px; }
  .t-block:last-child .t-row{ border-bottom:none; }
  .t-row .t-name{ font-family:'Fraunces', serif; font-size:15.5px; font-weight:500; }
  .t-row .t-num{ font-size:12px; color:var(--ink-soft); }
  .t-row small{ color:var(--ink-soft); }
  .t-row b{ color:var(--accent); }
  .t-check{ width:18px; height:18px; accent-color:var(--accent); }
  .t-logs{ display:none; background:var(--surface-alt); padding:8px 18px 12px 60px; border-bottom:1px solid var(--line); }
  .t-block.open .t-logs{ display:block; }
  .t-log{ display:flex; gap:10px; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .t-log:last-child{ border-bottom:none; }
  .t-log.cancelled{ color:#9A9184; text-decoration:line-through; }
  .t-log .tl-type{ font-weight:600; margin-right:6px; }


  /* 쓰는 동안 오른쪽에 보이는 미리보기 */
  .live-card{ border:1px solid var(--ink); border-radius:12px; background:#fff; margin-bottom:22px; overflow:hidden; }
  .live-head{ background:var(--accent); color:#fff; padding:14px 16px; }
  .live-kicker{ font-size:11.5px; opacity:0.85; }
  .live-title{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:4px 0 2px; line-height:1.4; }
  .live-who{ font-size:12px; opacity:0.9; text-align:right; min-height:14px; }
  .live-dots{ display:flex; gap:6px; padding:12px 16px 0; }
  .dot{ width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; background:#EFEBDD; color:#9A9184; }
  .dot1.on{ background:#3B5D45; color:#fff; } .dot2.on{ background:#C68A3D; color:#fff; } .dot3.on{ background:#A8442E; color:#fff; }
  .dot4.on{ background:#4A6FA5; color:#fff; } .dot5.on{ background:#7B5C8E; color:#fff; }
  .live-meta{ padding:8px 16px 0; font-size:12.5px; color:var(--ink-soft); }
  .live-body{ padding:12px 16px 4px; }
  .live-body p{ margin:0 0 10px; font-size:14.5px; line-height:1.9; text-indent:1em; }
  .live-body p.live-empty{ color:var(--ink-soft); text-indent:0; font-size:13.5px; }
  .live-card .read-btn{ margin:0 16px 14px; }

  .field-row3{ display:grid; grid-template-columns:1fr 1fr 110px; gap:12px; }
  .who-confirm{ font-size:13px; color:var(--accent); margin:10px 0 0; }
  .who-confirm:empty{ display:none; }
  .para-tools{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .para-tools .btn-ghost{ padding:6px 12px; font-size:13px; }
  .read-btn.speaking{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .read-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  body.no-tts .read-btn{ display:none; }
  .check-box{ margin-top:10px; border:1px solid var(--gold); background:var(--gold-soft); border-radius:8px; padding:10px 14px; font-size:13.5px; line-height:1.7; }
  .check-box ul{ margin:6px 0 0; padding-left:18px; }
  .check-title{ margin:0; font-weight:600; }
  .check-title small{ font-weight:400; color:var(--ink-soft); }
  .check-ok{ margin-top:10px; font-size:13px; color:var(--accent); }
  .fix-btn{ margin-left:6px; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:14px; padding:2px 10px; font-size:12px; font-weight:600; }
  .teacher-comment{ margin-top:10px; background:var(--gold-soft); border-left:3px solid var(--gold); padding:8px 12px; font-size:13.5px; line-height:1.6; border-radius:0 6px 6px 0; }
  .jump-live{ display:none; }

  /* 명예의 전당 */
  .hall{ border:1px solid var(--gold); background:linear-gradient(180deg,#FFF9EA,#FFFDF6); border-radius:12px; padding:14px 16px 12px; margin-bottom:20px; }
  .hall-title{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; margin:0 0 10px; }
  .hall-title small{ font-weight:400; font-size:12px; color:var(--ink-soft); font-family:'Work Sans', sans-serif; }
  .hall-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .hall-card{ flex:1 1 110px; max-width:170px; min-width:96px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 8px; text-align:center; display:flex; flex-direction:column; gap:2px; }
  .hall-rank{ font-size:12px; font-weight:700; border-radius:10px; padding:1px 10px; align-self:center; background:#ECE7D8; color:var(--ink-soft); }
  .hall-card.rank1{ border-color:#F6C945; } .hall-card.rank1 .hall-rank{ background:#F6C945; color:#5B4300; }
  .hall-card.rank2 .hall-rank{ background:#D5D9DE; color:#3B4048; } .hall-card.rank3 .hall-rank{ background:#D9A066; color:#4F2D0B; }
  .hall-name{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin-top:4px; }
  .hall-count{ font-size:13px; color:var(--accent); font-weight:600; }
  .hall-empty{ margin:0; font-size:13.5px; color:var(--ink-soft); }

  /* 선생님: 독서기록장 검토 */
  .review-card{ border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:10px; overflow:hidden; }
  .review-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 16px; cursor:pointer; background:var(--surface); }
  .review-card.open .caret{ transform:rotate(90deg); }
  .rv-who{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; }
  .rv-book{ font-size:13.5px; color:var(--ink-soft); }
  .rv-date{ font-size:12px; color:var(--ink-soft); margin-left:auto; }
  .review-body{ display:none; padding:6px 18px 18px; border-top:1px dashed var(--line); background:var(--surface-alt); }
  .review-card.open .review-body{ display:block; }
  .t-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .badge.warn{ background:#F3E2DD; color:var(--danger); border:none; }

  @media (max-width:860px){
    .page{ padding:24px 14px 60px; }
    .split{ grid-template-columns:1fr; gap:0; }
    .split-side{ border-left:none; padding-left:0; position:static; max-height:none; overflow:visible; border-top:1px solid var(--line); margin-top:30px; padding-top:22px; }
    .masthead{ padding:22px 18px; }
    .panel-wrap{ padding:20px 18px; }
    .save-bar{ margin:8px -18px -20px; padding:12px 18px; }
    .picker{ grid-template-columns:1fr 1fr; }
    .picker .pk-name{ grid-column:1 / -1; }
    .t-tool-grid{ grid-template-columns:1fr; }
    .t-head{ display:none; }
    .t-row{ grid-template-columns:30px 1fr auto; row-gap:4px; }
    .t-row .t-num{ display:none; }
    .t-row .t-stat{ grid-column:2 / -1; font-size:13px; }
    .t-row .t-name{ grid-column:2; grid-row:1; }
    .t-row .t-more{ grid-column:3; grid-row:1; white-space:nowrap; padding:6px 12px; }
    .t-row > span:first-child{ grid-column:1; grid-row:1; }
    .t-logs{ padding-left:18px; }
    input, select, textarea{ font-size:16px; }
    .btn-primary{ min-height:46px; }
    .btn-ghost{ min-height:40px; }
    .jump-live{ display:inline-block; }
    .field-row3{ grid-template-columns:1fr 1fr; }
    .field-row3 .field:last-child{ grid-column:1 / -1; }
    .hall-card{ flex:1 1 42%; max-width:none; }
    .rv-date{ margin-left:0; }
    .save-bar{ gap:8px; padding-top:10px; padding-bottom:10px; }
    .save-bar .progress{ flex-basis:100%; min-width:0; font-size:12.5px; }
    .save-bar .bar-btns{ width:100%; }
    .save-bar .bar-btns .btn-primary{ flex:1; padding:10px 8px; }
    .save-bar .bar-btns .btn-ghost{ padding:10px 10px; }
    .tabs{ flex-wrap:nowrap; padding-left:0; gap:3px; }
    .tab{ flex:1 1 0; padding:10px 2px; font-size:12.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  }
</style>

<body data-tab="record">
<div class="page">

  <header class="masthead">
    <p class="today" id="todayLabel"></p>
    <h1>매일 독서기록</h1>
    <p class="sub">학년과 반, 이름을 고르고 오늘 읽은 책을 기록해요. 다 읽은 책은 독서기록장에 서평으로 남겨요.</p>
  </header>

  <div class="gate-card" id="gate"></div>

  <div class="who-bar" id="whoBar">
    <p class="who-title">나는 누구일까요? 학년 · 반 · 이름을 골라요.</p>
    <div id="whoSlot"></div>
    <p class="who-confirm" id="whoConfirm"></p>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="record">매일 독서기록</button>
    <button class="tab" data-tab="essay">독서기록장</button>
    <button class="tab" data-tab="board">현황판</button>
    <button class="tab" data-tab="teacher">교사용 설정</button>
  </nav>

  <div class="panel-wrap">

    <!-- 매일 독서기록: 날짜, 책 이름, 읽은 챕터(쪽수), 줄거리, 느낀 점 -->
    <section class="tab-panel active" id="panel-record">
      <div class="split">
        <div class="split-main"><div id="recordFormArea"><p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p></div></div>
        <aside class="split-side" id="recordHistoryArea"></aside>
      </div>
    </section>

    <!-- 독서기록장: 책 이름, 다 읽은 날짜, 서평 5문단 / 옆에 완성된 글 -->
    <section class="tab-panel" id="panel-essay">
      <div class="split">
        <div class="split-main"><div id="essayFormArea"><p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p></div></div>
        <aside class="split-side" id="essayHistoryArea"><div id="essayLive"></div><div id="essayPast"></div></aside>
      </div>
    </section>

    <!-- 현황판: 학년·반별 독서록 권수 / 매일 독서기록 횟수 / 날짜별 현황 -->
    <section class="tab-panel" id="panel-board">
      <div class="board-top">
        <div id="boardPickerSlot"></div>
        <div>
          <label>날짜</label>
          <div class="date-nav">
            <button class="btn-icon" id="prevDayBtn" type="button">‹</button>
            <input type="date" id="boardDateInput">
            <button class="btn-icon" id="nextDayBtn" type="button">›</button>
          </div>

      <div>
        <button class="link-btn" id="jumpTodayBtn" type="button">오늘로 이동</button>
        <button class="link-btn" id="refreshBoardBtn" type="button">↻ 새로고침</button>
      </div>
      <div class="subtabs" id="boardSubtabs">
        <button class="subtab active" data-sub="books" type="button">독서록 권수</button>
        <button class="subtab" data-sub="count" type="button">매일 독서기록 횟수</button>
        <button class="subtab" data-sub="date" type="button">날짜별 현황</button>
      </div>
      <div id="boardArea"><p class="loading">불러오는 중...</p></div>
    </section>

    <!-- 교사용 설정: 손으로 쓴 독서록 체크, 면제권 사용, 특이사항 -->
    <section class="tab-panel" id="panel-teacher">
      <div id="teacherArea"></div>
    </section>

  </div>
</div>

<script>
(function(){
  // ★★★ 여기에 Apps Script 웹 앱 주소(/exec 로 끝나는 주소)를 붙여넣으세요. ★★★
  const API_URL = 'https://script.google.com/macros/s/AKfycbyAkqylJ1h_5Q8YJ8pnL0oEtSgIqWKN63Tb8d8FEy2eWOAr7dPPiqBz9wMfSgRp-rZc1Q/exec';

  // ---------- 작은 도구들 ----------
  const $ = id => document.getElementById(id);
  const TODAY = todayStr();

  function todayStr(d){
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDateKo(s){
    const p = s.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
  }
  function fmtShort(s){ const p = s.split('-').map(Number); return p[1] + '/' + p[2]; }
  function addDays(s, delta){
    const p = s.split('-').map(Number);
    const d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() + delta);
    return todayStr(d);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  $('todayLabel').textContent = '오늘은 ' + fmtDateKo(TODAY);

  // ---------- 서버(Apps Script)와 대화하기 ----------
  const SETUP_DONE = API_URL.indexOf('https://script.google.com/') === 0;
  const CODE_KEY = 'readinglog.classCode';
  let classCode = '';
  try{ classCode = localStorage.getItem(CODE_KEY) || ''; }catch(e){}

  async function unwrap(res){
    let json;
    try{ json = await res.json(); }catch(e){ throw new Error('서버 응답을 읽지 못했어요.'); }
    if(!json.ok){
      const err = new Error(json.error || '요청에 실패했어요.');
      err.fromServer = true;
      err.code = json.error;
      throw err;
    }
    return json.data;
  }
  async function apiGet(action, params){
    const qs = new URLSearchParams(Object.assign({ action: action, code: classCode }, params || {}));
    return unwrap(await fetch(API_URL + '?' + qs.toString()));
  }
  async function apiPost(action, payload){
    // 글자 그대로(text/plain) 보내야 브라우저가 사전 확인 없이 바로 전달해요.
    return unwrap(await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action, code: classCode }, payload))
    }));
  }

  // 화면에 보여줄 오류 문구 (서버가 준 한글 문구는 그대로, 그 외는 기본 문구)
  function showError(err, el, fallback){
    if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return; }
    el.textContent = (err && err.fromServer && err.message) ? err.message : fallback;
    el.style.display = 'block';
  }

  // ---------- 처음 설정 / 입장 코드 / 연결 오류 화면 ----------
  function showGate(kind, extra){
    const g = $('gate');
    document.body.classList.add('gated');
    if(kind === 'setup'){
      g.innerHTML = `
        <h2>처음 한 번만 설정이 필요해요</h2>
        <p>선생님께서 <code>index.html</code> 맨 위쪽의 <code>API_URL</code> 줄에 Apps Script 웹 앱 주소를 붙여넣어 주세요.</p>
        <p>주소는 <code>https://script.google.com/</code> 으로 시작해서 <code>/exec</code> 으로 끝나요.</p>
      `;
    } else if(kind === 'code'){
      g.innerHTML = `
        <h2>입장 코드를 입력해주세요</h2>
        <p>${extra === 'wrong' ? '코드가 맞지 않아요. 선생님께 다시 확인해보세요.' : '선생님께서 알려주신 코드를 입력하면 들어갈 수 있어요.'}</p>
        <div class="field"><input type="text" id="gateCodeInput" placeholder="입장 코드" autocomplete="off"></div>
        <button class="btn-primary" id="gateCodeBtn" type="button">들어가기</button>
      `;
      const input = $('gateCodeInput');
      const submit = () => {
        classCode = input.value.trim();
        try{ localStorage.setItem(CODE_KEY, classCode); }catch(e){}
        init();
      };
      $('gateCodeBtn').addEventListener('click', submit);
      input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
      input.focus();
    } else {
      g.innerHTML = `
        <h2>서버에 연결하지 못했어요</h2>
        <p>인터넷 연결을 확인하고 잠시 뒤에 다시 시도해주세요.</p>
        <button class="btn-primary" id="gateRetryBtn" type="button">다시 시도</button>
      `;
      $('gateRetryBtn').addEventListener('click', init);
    }
  }
  function hideGate(){ document.body.classList.remove('gated'); }

  // ---------- 공통 상태 ----------
  let roster = [];       // [{grade, cls, num, name}] (시트에 적은 순서 그대로)
  let books = [];
  let currentBook = '';
  let me = null;         // 고른 학생 (roster의 한 줄)
  let entries = [];      // 내 매일 독서기록 (최신 날짜 먼저)
  let essays = [];       // 내 독서기록장 (최근 저장 먼저)

  function studentParams(st){ st = st || me; return { grade: st.grade, cls: st.cls, name: st.name }; }

  // =====================================================
  // 학년 > 반 > 이름 고르기
  // =====================================================
  const NONE = '__none__';
  const toVal = x => x === '' ? NONE : x;
  const fromVal = v => v === NONE ? '' : v;
  function uniq(list){ const out = []; list.forEach(x => { if(out.indexOf(x) < 0) out.push(x); }); return out; }
  function hasClassInfo(){ return roster.some(s => s.grade || s.cls); }
  function gradesOf(){ return uniq(roster.map(s => s.grade)); }
  function classesOf(g){ return uniq(roster.filter(s => s.grade === g).map(s => s.cls)); }
  function gradeLabel(g){ return g ? g + '학년' : '학년 미지정'; }
  function classLabel(c){ return c ? c + '반' : '반 미지정'; }
  function studentLabel(s){ return (s.num ? s.num + '번 ' : '') + s.name; }
  function classTitle(g, c){ return (g || c) ? gradeLabel(g) + ' ' + classLabel(c) : '전체'; }

  const LAST_CLASS_KEY = 'readinglog.lastClass';
  function rememberClass(p){
    if(!p.gv || !p.cv) return;
    try{ localStorage.setItem(LAST_CLASS_KEY, JSON.stringify({ gv: p.gv, cv: p.cv })); }catch(e){}
  }
  function validClass(gv, cv){
    return roster.some(s => toVal(s.grade) === gv && toVal(s.cls) === cv);
  }
  function lastClass(){
    try{
      const o = JSON.parse(localStorage.getItem(LAST_CLASS_KEY) || 'null');
      if(o && validClass(o.gv, o.cv)) return o;
    }catch(e){}
    return null;
  }
  // 아직 반을 안 골랐으면: 내가 고른 반 > 지난번에 고른 반 > 명단 첫 반 순서로 정한다
  function defaultClassFor(p, allowFirst){
    if(!hasClassInfo() || (p.gv && p.cv)) return;
    if(me){ p.gv = toVal(me.grade); p.cv = toVal(me.cls); return; }
    const l = lastClass();
    if(l){ p.gv = l.gv; p.cv = l.cv; return; }
    if(allowFirst && roster.length){ p.gv = toVal(roster[0].grade); p.cv = toVal(roster[0].cls); }
  }
  // 선택칸을 새로 그린다 (이벤트가 두 번 붙지 않게 항상 새로 그린 뒤 붙인다)
  function remountPicker(p, slotId){
    $(slotId).innerHTML = p.html();
    p.mount();
  }

  function makePicker(id, withName, onChange){
    const p = { id: id, withName: withName, gv: '', cv: '', idx: -1, onChange: onChange };
    p.html = () => `
      <div class="picker${withName ? '' : ' no-name'}" id="${id}Box">
        <div class="pk-field pk-grade"><label for="${id}Grade">학년</label><select id="${id}Grade"></select></div>
        <div class="pk-field pk-class"><label for="${id}Class">반</label><select id="${id}Class"></select></div>
        ${withName ? `<div class="pk-field pk-name"><label for="${id}Name">이름</label><select id="${id}Name"></select></div>` : ''}
      </div>`;
    p.student = () => p.idx >= 0 ? roster[p.idx] : null;
    p.classInfo = () => (p.gv && p.cv) ? { grade: fromVal(p.gv), cls: fromVal(p.cv) } : null;
    p.mount = () => {
      const gSel = $(id + 'Grade'), cSel = $(id + 'Class'), nSel = withName ? $(id + 'Name') : null;
      const classMode = hasClassInfo();
      const ok = (g, c) => !p.allowed || p.allowed.some(a => a.grade === g && a.cls === c);
      gSel.parentElement.style.display = classMode ? '' : 'none';
      cSel.parentElement.style.display = classMode ? '' : 'none';
      function fill(){
        if(classMode){
          const grades = uniq(roster.filter(s => ok(s.grade, s.cls)).map(s => s.grade));
          if(!p.gv && grades.length === 1) p.gv = toVal(grades[0]);
          gSel.innerHTML = '<option value="">학년 선택</option>' + grades.map(g =>
            `<option value="${esc(toVal(g))}"${toVal(g) === p.gv ? ' selected' : ''}>${esc(gradeLabel(g))}</option>`).join('');
          const classes = p.gv ? uniq(roster.filter(s => s.grade === fromVal(p.gv) && ok(s.grade, s.cls)).map(s => s.cls)) : [];
          if(p.gv && !p.cv && classes.length === 1) p.cv = toVal(classes[0]);
          cSel.innerHTML = '<option value="">반 선택</option>' + classes.map(c =>
            `<option value="${esc(toVal(c))}"${toVal(c) === p.cv ? ' selected' : ''}>${esc(classLabel(c))}</option>`).join('');
          cSel.disabled = !p.gv;
        }
        if(nSel){
          const ready = !classMode || (p.gv && p.cv);
          const list = [];
          if(ready) roster.forEach((s, i) => {
            if(!classMode || (toVal(s.grade) === p.gv && toVal(s.cls) === p.cv && ok(s.grade, s.cls))) list.push({ s: s, i: i });
          });
          nSel.innerHTML = '<option value="">이름 선택</option>' + list.map(x =>
            `<option value="${x.i}"${x.i === p.idx ? ' selected' : ''}>${esc(studentLabel(x.s))}</option>`).join('');
          nSel.disabled = !ready;
        }
      }
      gSel.addEventListener('change', () => { p.gv = gSel.value; p.cv = ''; p.idx = -1; p.touched = true; fill(); p.onChange(p); });
      cSel.addEventListener('change', () => { p.cv = cSel.value; p.idx = -1; p.touched = true; fill(); rememberClass(p); p.onChange(p); });
      if(nSel) nSel.addEventListener('change', () => { p.idx = nSel.value === '' ? -1 : Number(nSel.value); p.onChange(p); });
      fill();
    };
    return p;
  }

  // 같은 책인지 비교할 때 쓰는 값: 띄어쓰기, 기호, 영어 대소문자가 달라도 같은 책으로 본다 (서버와 같은 기준)
  function bookKey(t){
    const s = String(t == null ? '' : t).normalize('NFC').toLowerCase();
    let k;
    try{ k = s.replace(new RegExp('[^\\p{L}\\p{N}]', 'gu'), ''); }
    catch(e){ k = s.replace(/[\s.,!?'"“”‘’()\[\]<>《》〈〉「」『』·\-_:;~]/g, ''); }
    return k || s.trim();
  }

  // ---------- 책 선택칸 (Books 시트 목록 + 직접 입력) ----------
  function bookFieldHtml(id, labelHtml, value){
    if(books.length === 0){
      return `
        <div class="field">
          <label for="${id}">${labelHtml}</label>
          <input type="text" id="${id}" placeholder="예: 마당을 나온 암탉" value="${esc(value)}">
        </div>`;
    }
    const custom = !!value && books.indexOf(value) < 0;
    return `
      <div class="field">
        <label for="${id}Select">${labelHtml}</label>
        <select id="${id}Select">
          <option value="">책을 선택하세요</option>
          ${books.map(b => `<option value="${esc(b)}"${b === value ? ' selected' : ''}>${esc(b)}</option>`).join('')}
          <option value="__custom__"${custom ? ' selected' : ''}>✏️ 직접 입력</option>
        </select>
        <input type="text" id="${id}" placeholder="책 이름을 직접 입력하세요" value="${custom ? esc(value) : ''}" style="margin-top:8px;display:${custom ? 'block' : 'none'};">
      </div>`;
  }
  function bindBookField(id, onChange){
    const input = $(id);
    const select = $(id + 'Select');
    if(!select){
      input.addEventListener('input', () => onChange(input.value));
      return;
    }
    select.addEventListener('change', () => {
      if(select.value === '__custom__'){
        input.style.display = 'block';
        input.focus();
        onChange(input.value);
      } else {
        input.style.display = 'none';
        onChange(select.value);
      }
    });
    input.addEventListener('input', () => onChange(input.value));
  }

  // ---------- 고른 학생 불러오기 ----------
  const whoPicker = makePicker('who', true, p => selectStudent(p.student()));

  async function selectStudent(st){
    me = st;
    stopSpeak();
    $('whoConfirm').textContent = st ? '✅ 지금은 ' + whoLine() + ' 학생이에요.' : '';
    entries = [];
    essays = [];
    recordDate = TODAY;
    recordDraft = freshRecordDraft();
    essayDraft = freshEssayDraft();
    essayNote = '';
    if(!st){
      renderRecordForm(); renderRecordHistory(); renderEssayForm(); renderEssayHistory();
      return;
    }
    $('recordFormArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    $('essayFormArea').innerHTML = '<p class="loading">불러오는 중...</p>';
    try{
      const d = await apiGet('getStudentData', studentParams(st));
      if(me !== st) return; // 그 사이 다른 학생으로 바뀐 경우
      entries = d.entries;
      essays = d.essays;
      recordDraft = freshRecordDraft();
      essayDraft = freshEssayDraft();
      renderRecordForm(); renderRecordHistory(); renderEssayForm(); renderEssayHistory();
    }catch(err){
      if(err && err.code === 'CODE_REQUIRED'){ showGate('code', 'wrong'); return; }
      const msg = '<p class="error-text">불러오지 못했어요. 다시 시도해주세요.</p>';
      $('recordFormArea').innerHTML = msg;

    const dateEl = $('recordDate');

    function checkValid(){

  // ---------- 소리 내어 읽어주기 (브라우저 기능, 지원하는 기기에서만 보여요) ----------
  const TTS_OK = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  if(!TTS_OK) document.body.classList.add('no-tts');
  function stopSpeak(){
    if(TTS_OK){ try{ window.speechSynthesis.cancel(); }catch(e){} }
    document.querySelectorAll('.read-btn.speaking').forEach(b => { b.classList.remove('speaking'); b.textContent = b.getAttribute('data-label') || '🔊 읽어주기'; });
  }
  function speakText(text, btn){
    if(!TTS_OK || !text.trim()) return;
    const wasThis = btn.classList.contains('speaking');
    stopSpeak();
    if(wasThis) return;
    const u = new window.SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.95;
    try{
      const v = (window.speechSynthesis.getVoices() || []).find(x => x.lang && x.lang.toLowerCase().indexOf('ko') === 0);
      if(v) u.voice = v;
    }catch(e){}
    if(!btn.getAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
    btn.classList.add('speaking');
    btn.textContent = '⏹ 멈추기';
    const done = () => { if(btn.classList.contains('speaking')){ btn.classList.remove('speaking'); btn.textContent = btn.getAttribute('data-label'); } };
    u.onend = done; u.onerror = done;
    window.speechSynthesis.speak(u);
  }

    // 1) 자주 틀리는 맞춤법
    const seen = {};
    SPELL_RULES.forEach(r => {
      if(t.indexOf(r[0]) >= 0 && !seen[r[0]]){ seen[r[0]] = true; out.push({ kind: 'fix', msg: `"${r[0]}" → "${r[1]}"`, find: r[0], to: r[1] }); }
    });
    // 받침 ㄹ + "께" 는 "게"로 써요 (할께 → 할게)
    (t.match(/[가-힣]+께/g) || []).forEach(w => {
      const last = w.charCodeAt(w.length - 2) - 0xAC00;       // 께 바로 앞 글자
      if(last >= 0 && last % 28 === 8 && !seen[w]){
        seen[w] = true;
        const fixed = w.slice(0, -1) + '게';
        out.push({ kind: 'fix', msg: `"${w}" → "${fixed}"`, find: w, to: fixed });
      }
    });
    // 2) 글에서는 쓰지 않는 표현
    if(/[ㅋㅎㅠㅜㅡ]{2,}/.test(t)) out.push({ kind: 'tip', msg: 'ㅋㅋ, ㅎㅎ, ㅠㅠ 같은 표현은 글에서는 쓰지 않아요. 낱말로 바꿔 써요.' });
    // 3) 같은 말이 바로 이어서 나올 때
    const rep = t.match(/(\S{2,})\s+\1(?=[\s.,!?]|$)/);
    if(rep) out.push({ kind: 'tip', msg: `같은 말이 이어서 두 번 나와요: "${rep[0]}"` });
    // 4) 문장 살펴보기
    const sentences = (t.match(/[^.!?\n]+[.!?]*/g) || []).map(x => x.trim()).filter(Boolean);
    const long = sentences.find(x => x.length > 70);
    if(long) out.push({ kind: 'tip', msg: `문장이 너무 길어요. 둘로 나누어 볼까요? "${long.slice(0, 22)}…"` });
    const ends = sentences.map(x => x.replace(/[.!?]+$/, '').slice(-2));
    for(let i = 0; i + 2 < ends.length; i++){
      if(ends[i].length === 2 && ends[i] === ends[i+1] && ends[i] === ends[i+2]){
        out.push({ kind: 'tip', msg: `문장이 계속 "…${ends[i]}"로 끝나요. 끝을 조금 바꿔 보면 글이 더 자연스러워요.` });
        break;
      }
    }
    ['그리고', '그래서', '하지만'].forEach(w => {
      if((t.match(new RegExp(w, 'g')) || []).length >= 3) out.push({ kind: 'tip', msg: `"${w}"가 여러 번 나와요. 일부는 빼거나 다른 말로 바꿔 볼까요?` });
    });
    if(!/[.!?]["”')\]]*\s*$/.test(t.trim())) out.push({ kind: 'fix', msg: '글 끝에 마침표(.)가 없어요.', append: '.' });
    if(sentences.length < 2 && t.trim().length < 40) out.push({ kind: 'tip', msg: '문단이 조금 짧아요. 2~3문장 이상으로 자세히 써 볼까요?' });
    return out;
  }

    if(!me){ box.innerHTML = ''; return; }

    const book = d.book.trim();

          <div class="live-who">${esc(whoLine())}</div>
        </div>

    const area = $('essayFormArea');
    renderEssayLive();
    if(!me){
      area.innerHTML = '<p class="empty-note">먼저 위에서 학년, 반, 이름을 골라주세요.</p>';
      return;
    }
    const d = essayDraft;
    const cur = findEssay(d.book);
    const reviseNote = (cur && cur.status === '수정요청' && cur.note)
      ? `<p class="note-box warn">↩️ 선생님이 고쳐 쓰기를 부탁했어요.<br>💬 ${esc(cur.teacherName ? cur.teacherName + ' 선생님' : '선생님')}: ${esc(cur.note)}</p>` : '';
    area.innerHTML = `
      <p class="note-box" id="essayNote" style="display:${essayNote ? 'block' : 'none'};">${esc(essayNote)}</p>
      ${reviseNote}
      ${bookFieldHtml('essayBook', '책 이름', d.book)}
      <p class="hint-line" style="margin-top:-10px;">같은 책은 띄어쓰기가 달라도 같은 책으로 봐요. 한 책은 독서록 권수에 한 번만 들어가요.</p>
      <div class="field-row3">
        <div class="field"><label for="essayAuthor">글쓴이(저자) <span class="opt">(선택)</span></label><input type="text" id="essayAuthor" value="${esc(d.author)}"></div>
        <div class="field"><label for="essayPublisher">출판사 <span class="opt">(선택)</span></label><input type="text" id="essayPublisher" value="${esc(d.publisher)}"></div>
        <div class="field"><label for="essayPages">쪽수 <span class="opt">(선택)</span></label><input type="text" id="essayPages" inputmode="numeric" placeholder="예: 216" value="${esc(d.pages)}"></div>
      </div>
      <div class="field">
        <label for="essayFinish">다 읽은 날짜 (읽은 시기)</label>
        <input type="date" id="essayFinish" value="${esc(d.finishDate)}" max="${TODAY}">
      </div>
      <div class="title-card">
        <div class="card-head"><h3>서평 제목</h3></div>
        <p class="para-guide">${TITLE_TIP.text}</p>
        <details class="tip"><summary>📖 예시 보기</summary>
          <div class="tip-body"><ul>${TITLE_TIP.examples.map(x => `<li><span class="ex-label">예</span>${x}</li>`).join('')}</ul></div>
        </details>
        <input type="text" id="essayTitle" placeholder="내가 쓸 서평의 제목" value="${esc(d.title)}">
      </div>
      <p class="hint-line">각 문단은 줄을 바꾸지 않고 이어서 써요. 오른쪽(또는 아래)에는 내가 쓴 글이 문단 제목 없이 한 편의 글로 보여요.</p>
      <p style="margin:0 0 14px;"><button type="button" class="btn-ghost" id="checkAllBtn">✔ 전체 글 점검 (맞춤법·어색한 문장)</button></p>
      ${ESSAY_PARAS.map((_, i) => paraCardHtml(i, d)).join('')}
      <div class="save-bar">
        <span class="progress" id="essayProgress"></span>
        <span class="bar-btns">
          <button type="button" class="btn-ghost jump-live" id="jumpLiveBtn">👁 미리보기</button>
          <button class="btn-ghost" id="essayDraftBtn" type="button" disabled>임시 저장</button>
          <button class="btn-primary" id="essaySubmitBtn" type="button" disabled>선생님께 제출하기</button>
        </span>
        <p class="note-box warn" id="essayDupNote" style="display:none;margin:0;width:100%;"></p>
        <p class="save-msg" id="essaySaveMsg"></p>
        <p class="error-text" id="essayError" style="display:none;"></p>
      </div>
    `;

    const draftBtn = $('essayDraftBtn');
    const submitBtn = $('essaySubmitBtn');
    const saveMsg = $('essaySaveMsg');
    const errEl = $('essayError');

    function refresh(){
      const done = d.paras.filter(p => p.trim()).length;
      d.paras.forEach((p, i) => {
        $('paraCard' + i).classList.toggle('filled', !!p.trim());
        $('paraCount' + i).textContent = p.trim() ? p.trim().length + '자' : '';
        const rb = area.querySelector(`[data-read="${i}"]`);
        if(rb) rb.disabled = !p.trim();
      });
      $('essayProgress').innerHTML = done === 5
        ? '<b>5문단을 모두 썼어요!</b> 제출하면 선생님이 확인해요.'
        : `서평 문단 <b>${done}/5</b> · 모두 쓰면 제출할 수 있어요.`;
      const dup = findEssay(d.book);
      const locked = !!(dup && dup.status === '확인완료');
      draftBtn.disabled = locked || !(d.book.trim() && (d.title.trim() || done > 0));
      submitBtn.disabled = locked || !(d.book.trim() && done === 5);
      const dupNote = $('essayDupNote');
      if(locked){
        dupNote.textContent = '이 책은 이미 선생님이 확인했어요. 같은 책은 한 번만 낼 수 있고, 확인한 글은 고칠 수 없어요.';
        dupNote.style.display = 'block';
      } else if(dup && !essayDraftEmpty(d)){
        dupNote.textContent = '이 책으로 쓴 독서기록장이 이미 있어요. 저장하면 지금 쓴 내용으로 바뀌어요.';
        dupNote.style.display = 'block';
      } else {
        dupNote.style.display = 'none';
      }
      renderEssayLive();
    }
    function touched(){ saveMsg.classList.remove('show'); refresh(); }

    bindBookField('essayBook', v => {
      d.book = v;
      const dup = findEssay(v);
      if(dup && essayDraftEmpty(d)){
        // 비어 있는 상태에서 이미 쓴 책을 고르면, 쓰던 글을 불러온다
        essayDraft = draftFromEssay(dup);
        essayNote = dup.status === '확인완료' ? '선생님이 확인한 독서기록장이에요. 읽기만 할 수 있어요.' : '이 책으로 쓰던 독서기록장을 불러왔어요. 이어서 쓰면 돼요.';
        renderEssayForm();
        return;
      }
      touched();
    });
    $('essayAuthor').addEventListener('input', e => { d.author = e.target.value; touched(); });
    $('essayPublisher').addEventListener('input', e => { d.publisher = e.target.value; touched(); });
    $('essayPages').addEventListener('input', e => { d.pages = e.target.value; touched(); });
    $('essayFinish').addEventListener('change', e => {
      if(!e.target.value || e.target.value > TODAY){ e.target.value = d.finishDate; return; }
      d.finishDate = e.target.value; touched();
    });
    $('essayTitle').addEventListener('input', e => { d.title = e.target.value; touched(); });
    ESSAY_PARAS.forEach((_, i) => {
      $('essayP' + i).addEventListener('input', e => { d.paras[i] = e.target.value; touched(); });
    });
    // 느낌 낱말을 눌러서 3문단에 넣기
    area.querySelectorAll('.word-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const ta = $(chip.getAttribute('data-target'));
        const w = chip.getAttribute('data-word');
        const start = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
        const end = ta.selectionEnd == null ? ta.value.length : ta.selectionEnd;
        ta.value = ta.value.slice(0, start) + w + ta.value.slice(end);
        const pos = start + w.length;
        try{ ta.setSelectionRange(pos, pos); ta.focus(); }catch(e){}
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      });
    });
    // 문단 읽어주기
    area.querySelectorAll('[data-read]').forEach(b => {
      b.addEventListener('click', () => speakText(d.paras[Number(b.getAttribute('data-read'))], b));
    });
    // 글 점검
    function runCheck(i){
      $('checkResult' + i).innerHTML = d.paras[i].trim() ? checkHtml(i, checkText(d.paras[i])) : '';
      $('checkResult' + i).querySelectorAll('.fix-btn').forEach(fb => {
        fb.addEventListener('click', () => {
          const ta = $('essayP' + i);
          if(fb.getAttribute('data-append')) ta.value = ta.value.replace(/\s+$/, '') + fb.getAttribute('data-to');
          else ta.value = ta.value.split(fb.getAttribute('data-find')).join(fb.getAttribute('data-to'));
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          runCheck(i);
        });
      });
    }
    area.querySelectorAll('[data-check]').forEach(b => {
      b.addEventListener('click', () => {
        const i = Number(b.getAttribute('data-check'));
        if(!d.paras[i].trim()){ $('checkResult' + i).innerHTML = '<div class="check-ok">먼저 글을 써 보세요.</div>'; return; }
        runCheck(i);
      });
    });
    $('checkAllBtn').addEventListener('click', () => {
      let n = 0;
      d.paras.forEach((p, i) => { runCheck(i); if(p.trim()) n += checkText(p).length; });
      saveMsg.textContent = n ? `글 점검 결과: 알려줄 것이 ${n}가지 있어요. 각 문단 아래를 확인해요.` : '글 점검 결과: 눈에 띄는 문제가 없어요. 👍';
      saveMsg.classList.add('show');
    });
    $('jumpLiveBtn').addEventListener('click', () => {
      $('essayLive').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    refresh();

    async function save(submit){
      draftBtn.disabled = true; submitBtn.disabled = true;
      const label = submit ? submitBtn.textContent : draftBtn.textContent;
      (submit ? submitBtn : draftBtn).textContent = '저장 중...';
      saveMsg.classList.remove('show');
      errEl.style.display = 'none';
      try{
        essays = await apiPost('submitEssay', Object.assign(studentParams(), {
          bookTitle: d.book.trim(), author: d.author.trim(), publisher: d.publisher.trim(), pages: d.pages.trim(),
          finishDate: d.finishDate, reviewTitle: d.title.trim(), paragraphs: d.paras, submit: submit
        }));
        saveMsg.textContent = submit
          ? '선생님께 제출했어요! 선생님이 확인하면 독서록 권수에 들어가요. 👍'
          : '임시 저장했어요. 5문단을 모두 쓰면 선생님께 제출할 수 있어요.';
        saveMsg.classList.add('show');
        renderEssayHistory();
      }catch(err){
        showError(err, errEl, '저장에 실패했어요. 다시 시도해주세요.');
      }finally{
        (submit ? submitBtn : draftBtn).textContent = label;
        refresh();
      }
    }
    draftBtn.addEventListener('click', () => save(false));
    submitBtn.addEventListener('click', () => save(true));
  }

  function essayStatusBadge(e){
    if(e.recordType !== '온라인') return '<span class="badge done">' + esc(e.recordType) + ' · 선생님 확인</span>';
    if(e.status === '확인완료') return '<span class="badge done">✅ 확인 완료</span>';
    if(e.status === '제출함') return '<span class="badge pending">⏳ 선생님 확인 대기</span>';
    if(e.status === '수정요청') return '<span class="badge warn">↩️ 수정 요청</span>';
    return '<span class="badge draft">✍️ 작성 중</span>';
  }
